<head>

<title>PAZAPA Lecture — La route des lettres — Lettre Y</title>
<!--
  PAZAPA — « Je lis avec Léo et Fadi » — Niveau 1 — JEU « LA ROUTE DES LETTRES » — lettre du son Y
  Fichier autonome (HTML + CSS + JS, aucune bibliothèque, aucun appel réseau), prévu pour une iframe Moodle.

  POUR CRÉER UNE AUTRE LETTRE : tout se règle dans le bloc « CONFIG » et le bloc « AUDIO » au début du script
  (lettre cible, lettres distractrices, texte de la consigne, nombre de lettres, vitesse et fréquences par niveau).
  Le moteur (route, voiture, collisions, écrans) ne dépend pas de la lettre.

  AUDIOS (ElevenLabs uniquement, jamais de synthèse vocale) : un emplacement vide "" = pas de voix, le jeu fonctionne quand même.
  Charte reprise des jeux validés (La Course aux Lettres, À la recherche des lettres, Teste tes connaissances) :
  couleurs, police, boutons, bandeau sombre, écran de fin, logo, Léo et Fadi (illustrations originales, non modifiées).
  Aucun bouton « Retour à la montagne ». Pas de vies, pas de score, pas de chronomètre, pas de musique.
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{font-family:"Arial Rounded MT Bold",Arial,sans-serif;background:#E4F7FB;background-image:linear-gradient(160deg,#E4F7FB,#F3F7DD);color:#1d2a2a;display:flex;flex-direction:column;align-items:center;padding:6px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{width:100%;max-width:900px}
button{font-family:inherit;color:#1d2a2a}
[hidden]{display:none!important}
#marque{text-align:center;margin:0 0 4px;line-height:0}
#marque img{height:clamp(30px,5vw,40px);width:auto;max-width:60%}

/* ===== ACCUEIL ===== */
#menu{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-bottom:6px}
.niv{font-size:.8rem;letter-spacing:.12em;font-weight:bold;color:#6b7775;text-transform:uppercase}
.titre{border:3px dashed #36BBD6;border-radius:18px;background:#fff;padding:6px 18px;max-width:100%}
.titre h1{font-size:clamp(1.5rem,5vw,2.2rem);line-height:1.15}
.titre h1 span{color:#DB2E38}
#carHome{width:clamp(110px,22vw,150px);height:auto;display:block}
.accr{display:flex;align-items:center;justify-content:center;gap:10px;max-width:34em}
.accr p{font-size:clamp(1rem,2.8vw,1.2rem);line-height:1.3;text-align:left}
.vb{flex:none;width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1.5px solid #F2BD36;background:#FFF1BC;cursor:pointer}
.vb svg{width:20px;height:20px;display:block;pointer-events:none}
.vb:hover{background:#FFE9A0}.vb:active{background:#FFE08A}
.vb:focus-visible,.btn:focus-visible,.chip:focus-visible,.ib:focus-visible,.dir:focus-visible{outline:3px solid #D66A13;outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{min-height:48px;padding:4px 12px;border-radius:12px;border:3px solid #1d2a2a;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.chip small{font-size:.8rem;font-weight:normal}
.chip b{font-size:1rem}
.chip[aria-pressed="true"]{background:#C9D844}
.btn{min-height:48px;min-width:48px;padding:8px 20px;border-radius:12px;border:3px solid #1d2a2a;background:#fff;font-size:1.1rem;cursor:pointer}
.btn.go{background:#FCC104;font-weight:bold}
.btn:active{transform:scale(.96)}
#start{min-height:56px;font-size:1.3rem;padding:8px 34px}

/* ===== JEU ===== */
#game{display:none}
#hud{background:#2E2E2D;color:#fff;border-radius:12px 12px 0 0;padding:5px 10px;display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
#hud .nv{flex:1;min-width:120px;line-height:1.1}
#hud .nv b{display:block;font-size:clamp(1rem,3.4vw,1.25rem)}
#hud .nv span{font-size:.82rem;opacity:.85}
.compteur{display:flex;align-items:center;gap:8px;background:#fff;color:#1d2a2a;border-radius:12px;padding:3px 12px;font-weight:bold;font-size:clamp(1.25rem,4.4vw,1.6rem);white-space:nowrap;transition:transform .15s}
.compteur.plus{transform:scale(1.14)}
.jauge{width:clamp(54px,14vw,110px);height:12px;border-radius:8px;background:#e3e6e2;overflow:hidden}
.jauge i{display:block;height:100%;width:0;background:#8dc63f;border-radius:8px;transition:width .25s}
.ib{min-height:44px;min-width:44px;border-radius:50%;border:3px solid #fff;background:#6cc02d;font-size:1.15rem;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.ib svg{width:20px;height:20px;pointer-events:none}
.ib.off{background:#888}
#stage{position:relative;width:100%;overflow:hidden;background:#cfeab5;line-height:0;touch-action:none}
#cv{display:block;width:100%}
.ov{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center;line-height:1.25}
.ov.on{display:flex}
#ovPause{background:rgba(20,50,60,.68);color:#fff;font-size:1.6rem;z-index:8}
#ovIntro{background:rgba(255,253,247,.18)}
#cd{font-size:clamp(5.5rem,24vw,10rem);font-weight:bold;line-height:1;color:#fff;-webkit-text-stroke:5px #1d2a2a;paint-order:stroke fill;text-shadow:0 6px 0 rgba(0,0,0,.18);min-height:1em}
#cd.pop{animation:cdpop .7s ease-out}
@keyframes cdpop{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.carte{background:#fffdf7;border:4px solid #FCC104;border-radius:18px;padding:12px 18px;max-width:min(92%,460px);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.carte h2{font-size:clamp(1.5rem,5vw,2rem)}
.carte .sousn{font-size:1.05rem;color:#4a5a5a;margin-bottom:6px}
.carte p{font-size:clamp(1.05rem,3.2vw,1.25rem)}
.cmds{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 2px;font-size:1rem;color:#4a5a5a}
.touche{width:46px;height:46px;border-radius:12px;border:3px solid #1d2a2a;background:#FCC104;display:flex;align-items:center;justify-content:center}
.touche svg,.dir svg{width:26px;height:26px}
#ovCrash .carte{border-color:#f08a24;animation:pop .3s ease-out}
#ovCrash p{font-size:clamp(1.3rem,4.6vw,1.8rem);font-weight:bold}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
#ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.dir{min-height:clamp(60px,12vw,78px);border-radius:16px;border:3px solid #1d2a2a;background:#FCC104;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.dir svg{width:38px;height:38px;pointer-events:none}
.dir:active,.dir.down{transform:scale(.97);background:#ffd84a}

/* ===== FIN DE NIVEAU / FIN DU JEU ===== */
#end{display:none;position:relative;overflow:hidden;background:#fffdf7;border:4px solid #FCC104;border-radius:18px;padding:12px 12px 16px;text-align:center;margin-top:8px}
#end h2{font-size:clamp(1.6rem,5vw,2.2rem);margin-bottom:2px}
#endSub{font-size:clamp(1.25rem,4vw,1.6rem);font-weight:bold;color:#2d7d1f;margin-bottom:2px}
#lvName{font-size:1rem;color:#4a5a5a;margin-bottom:6px}
.endrow{display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,34px);flex-wrap:wrap;margin:4px 0}
.endrow img{height:clamp(96px,17vw,140px);width:auto;animation:joy .9s ease-in-out infinite alternate;-webkit-user-drag:none}
.endrow img + img{animation-delay:.3s}
@keyframes joy{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-10px) rotate(3deg)}}
.rc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 18px;border:3px solid #cfe3c0;border-radius:16px;background:#f4fbea}
.rc .ico{width:34px;height:34px;border-radius:50%;background:#e1f1c8;display:flex;align-items:center;justify-content:center;color:#2d7d1f;font-weight:bold;font-size:1.2rem}
.rc .rl{font-size:1rem;color:#4a5a5a}
.rc .rv{font-size:clamp(1.8rem,5.5vw,2.3rem);font-weight:bold;line-height:1.1}
.btns{margin-top:10px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
#end .btn.go{min-height:60px;font-size:1.35rem;padding:10px 30px}
.cf{position:absolute;top:-16px;width:10px;height:14px;border-radius:3px;opacity:0;animation:fall 3.2s ease-in forwards;pointer-events:none}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(520px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.endrow img,.cf{animation:none!important}}
</style>
</head>

/* ---------- Bruitages : Web Audio, courts et doux, aucune musique ---------- */
var Sfx=(function(){
  var ac=null,on=true;
  function ctx(){
    if(!on)return null;

      o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

    faux:function(){tone("sine",300,230,0,.2,.1);},                                               /* petit signal discret */

    bascule:function(){on=!on;return on;},actif:function(){return on;},reveil:function(){ctx();}

})();

   LOGIQUE DU JEU (aucun dessin ici)

var G=null;                 /* partie en cours */
var sel=0;                  /* niveau choisi à l'accueil */
var consigneDite=false;     /* la consigne n'est lue automatiquement qu'au début de la première partie */
var raf=0,dernier=0;

function nouvellePartie(i){
  var L=CONFIG.niveaux[i];
  return {i:i,L:L,etat:"intro",           /* intro | jeu | pause | choc | gagne */
    voie:1,x:1,                             /* voie visée (0,1,2) et position réelle de la voiture, en voies */
    objets:[],dist:0,minuteur:.7,rang:0,pris:0,faux:0,
    sansCible:0,suiteObst:0,nObst:0,nId:0,dernVoieCible:-1,dernVoieObst:-1,
    fx:[],tremble:0,tChoc:0,avant:null,dernMouv:0,t:0};
}
function alea(n){return Math.floor(Math.random()*n);}
function auHasard(a){return a[alea(a.length)];}
function voieLibre(interdites,eviter){
  var c=[];for(var v=0;v<LANES;v++)if(interdites.indexOf(v)<0)c.push(v);
  if(c.length>1&&eviter>=0){var d=c.filter(function(v){return v!==eviter;});if(d.length)c=d;}
  return auHasard(c);
}
/* Une « rangée » = ce qui apparaît en haut de la route à un instant donné.
   Garanties de faisabilité :
     - jamais d'obstacle sur les trois voies ; une rangée a au plus un obstacle, sauf la rangée « double »
       (gauche + droite) où la voie du milieu reste libre : depuis n'importe quelle voie, une voie libre est donc
       toujours à UN déplacement au plus ;
     - l'intervalle entre deux rangées laisse largement le temps de ce déplacement ;
     - jamais deux objets sur la même voie dans une rangée ; jamais plus de deux rangées d'obstacles à la suite ;
     - une lettre cible revient au plus tard toutes les trois rangées, tant qu'il en reste à proposer. */
function prochaineRangee(g){
  var L=g.L,n=g.rang++,type;
  /* Jamais plus de lettres cibles que le nombre à trouver : (déjà attrapées) + (visibles sur la route) < cible.
     La dernière attend que l'enfant ait croisé « obstMin » obstacles. */
  var visibles=g.objets.filter(function(o){return o.cible;}).length,reste=L.cible-g.pris-visibles;
  var peutCible=reste>0&&!(reste===1&&g.nObst<(L.obstMin||0));
  var forcer=peutCible&&g.sansCible>=2;                       /* forcer : cette rangée doit contenir une lettre cible */
  if(n<L.douceur){type=peutCible?"cible":"vide";}
  else{
    var p={cible:peutCible?L.pCible:0,distr:L.distracteurs.length?L.pDistr:0,obst:L.pObst,combo:peutCible?L.pCombo:0,double:L.pDouble};
    if(g.suiteObst>=2){p.obst=0;p.combo=0;p.double=0;}
    if(forcer){p.distr=0;p.obst=0;p.double=0;}
    var tot=0,k;for(k in p)tot+=p[k];
    type="vide";
    if(tot>0){var r=Math.random()*tot;for(k in p){if(r<p[k]){type=k;break;}r-=p[k];}}
  }
  var out=[],vo;
  function lettre(estCible,interdites){
    var v;
    if(estCible){
      v=(n===0)?1:voieLibre(interdites,g.dernVoieCible);g.dernVoieCible=v;
      out.push({genre:"lettre",ch:CONFIG.lettre,cible:true,voie:v});
    }else{
      v=voieLibre(interdites,-1);
      out.push({genre:"lettre",ch:auHasard(L.distracteurs),cible:false,voie:v});
    }
  }
  function obstacle(v){out.push({genre:"obstacle",forme:auHasard(["cone","caisse","pierre"]),voie:v});g.dernVoieObst=v;}
  if(type==="cible"){lettre(true,[]);}
  else if(type==="distr"){lettre(false,[]);}
  else if(type==="obst"){obstacle(voieLibre([],g.dernVoieObst));}
  else if(type==="combo"){vo=voieLibre([],g.dernVoieObst);obstacle(vo);lettre(true,[vo]);}
  else if(type==="double"){obstacle(0);obstacle(2);}
  var aCible=out.some(function(o){return o.cible;}),aObst=out.some(function(o){return o.genre==="obstacle";});
  g.sansCible=aCible?0:g.sansCible+1;
  g.suiteObst=aObst?g.suiteObst+1:0;
  if(aObst)g.nObst++;
  return out;
}

/* Mesures de la route, recalculées à chaque redimensionnement (tout est proportionnel à la route) */
var M={W:0,H:0,rx:0,rw:0,lw:0,carW:0,carH:0,carY:0,ob:0};
function centreVoie(v){return M.rx+M.lw*(v+.5);}

function deplacer(sens){
  var g=G;if(!g||g.etat!=="jeu")return;
  var t=performance.now();if(t-g.dernMouv<70)return;          /* anti-rebond : jamais de double saut involontaire */
  var v=Math.max(0,Math.min(LANES-1,g.voie+sens));
  if(v===g.voie)return;                                        /* déjà au bord : rien ne se passe */
  g.voie=v;g.dernMouv=t;Sfx.voie();
}
function majLogique(g,dt){
  g.t+=dt;
  /* la voiture glisse vers sa voie (déplacement horizontal uniquement) */
  var d=g.voie-g.x,pas=dt*9;g.x+=Math.abs(d)<=pas?d:(d>0?pas:-pas);
  for(var k=g.fx.length-1;k>=0;k--){g.fx[k].t+=dt;if(g.fx[k].t>g.fx[k].d)g.fx.splice(k,1);}
  if(g.tremble>0)g.tremble=Math.max(0,g.tremble-dt);
  if(g.etat!=="jeu")return;
  var v=g.L.vitesse*M.H;
  g.dist+=v*dt;
  g.minuteur-=dt;
  if(g.minuteur<=0){
    g.minuteur+=g.L.intervalle;
    prochaineRangee(g).forEach(function(o){o.y=-M.ob;o.pris=false;o.id=++g.nId;g.objets.push(o);});
  }
  var carX=M.rx+M.lw*(g.x+.5),haut=M.carY+M.carH*.12,bas=M.carY+M.carH*.92;
  for(var i=g.objets.length-1;i>=0;i--){
    var o=g.objets[i];o.y+=v*dt;
    if(o.y-M.ob>M.H){g.objets.splice(i,1);continue;}
    if(o.pris)continue;
    var ox=centreVoie(o.voie),marge=o.genre==="obstacle"?.34:.42;     /* obstacles : zone de contact un peu plus petite que le dessin (indulgent) */
    var touche=Math.abs(ox-carX)<(M.carW+M.ob)*marge && o.y+M.ob*.38>haut && o.y-M.ob*.38<bas;
    if(!touche)continue;
    if(o.genre==="obstacle"){collision(g,o);return;}
    o.pris=true;g.objets.splice(i,1);
    if(o.cible){
      g.pris++;Sfx.bon();g.fx.push({type:"bon",x:ox,y:M.carY,t:0,d:.7});majCompteur(true);
      if(g.pris>=g.L.cible){gagner(g);return;}
    }else{
      g.faux++;Sfx.faux();g.fx.push({type:"faux",x:ox,y:M.carY,t:0,d:.5});
    }
  }
}
function collision(g,o){
  if(g.etat!=="jeu")return;                 /* jamais deux collisions pour un même choc */
  g.etat="choc";g.tremble=.5;g.fx.push({type:"choc",x:centreVoie(o.voie),y:M.carY,t:0,d:.9});
  Sfx.choc();
  var my=g;
  setTimeout(function(){
    if(G!==my||my.etat!=="choc")return;
    $("ovCrash").classList.add("on");
    var fini=false,suite=function(){if(fini)return;fini=true;if(G===my&&my.etat==="choc")recommencer(my);};
    var ok=Voix.play("obstacle",function(){setTimeout(suite,500);});
    setTimeout(suite,ok?6000:2400);         /* message affiché ~2,4 s (ou jusqu'à la fin de la voix), puis redémarrage automatique */
  },350);
}
function recommencer(g){
  /* même niveau, compteur à zéro, voiture au centre, vitesse du niveau */
  Voix.stop();
  $("ovCrash").classList.remove("on");
  var n=nouvellePartie(g.i);n.etat="jeu";n.minuteur=1.1;G=n;majCompteur(false);
}
function gagner(g){
  if(g.etat==="gagne")return;               /* jamais deux réussites */
  g.etat="gagne";Sfx.niveau();
  for(var k=0;k<14;k++)g.fx.push({type:"etoile",x:M.rx+Math.random()*M.rw,y:M.H*(.2+Math.random()*.6),t:-Math.random()*.4,d:.9});
  var my=g;setTimeout(function(){if(G===my)finNiveau(my);},1100);
}

var cv=$("cv"),cx=cv.getContext("2d"),DPR=1;

  M.carW=M.lw*.56;M.carH=M.carW*1.62;M.carY=H-M.carH-14;

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
/* petit générateur reproductible pour le décor */
function graine(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function dessinerDecor(c,g){
  c.fillStyle="#cfeab5";c.fillRect(0,0,M.W,M.H);
  var P=M.H*2.2,off=(g?g.dist:0)%P,lat=M.rx-10;
  if(lat<18)return;

    var y=((d.v*P+off)%P)-M.H*.1,x=(d.cote?M.rx+M.rw+10:0)+ (8+d.u*(lat-16));

      c.fillStyle="rgba(60,110,50,.16)";c.beginPath();c.ellipse(x+5*k,y+7*k,24*k,22*k,0,0,7);c.fill();
      c.fillStyle="#8fca6d";c.beginPath();c.arc(x,y,23*k,0,7);c.fill();

    }else if(d.genre==="buisson"){

    }else{
      var col=["#ffffff","#ffd6e0","#fff1a8"][Math.floor(d.c*3)];
      for(var f=0;f<3;f++){var fx=x+(f-1)*13*k,fy=y+((f%2)?6:-4)*k;c.fillStyle=col;for(var p=0;p<5;p++){c.beginPath();c.arc(fx+Math.cos(p*1.257)*3.6*k,fy+Math.sin(p*1.257)*3.6*k,2.6*k,0,7);c.fill();}c.fillStyle="#f6c343";c.beginPath();c.arc(fx,fy,2.1*k,0,7);c.fill();}
    }
  });
}
function dessinerRoute(c,g){
  c.fillStyle="#e9eef2";c.fillRect(M.rx-7,0,M.rw+14,M.H);                 /* bas-côtés clairs */
  c.fillStyle="#9aa6b2";c.fillRect(M.rx,0,M.rw,M.H);                      /* chaussée */
  c.fillStyle="#fff";c.fillRect(M.rx+3,0,4,M.H);c.fillRect(M.rx+M.rw-7,0,4,M.H);
  var pas=M.H*.16,trait=pas*.52,off=(g?g.dist:0)%pas;

function dessinerLettre(c,o){

  c.fillStyle="rgba(0,0,0,.18)";rr(c,x+2,y+5,s,s,s*.24);c.fill();

/* La voiture, vue du dessus, l'avant vers le haut. (x,y) = coin haut-gauche. */

      c.fillStyle="rgba(45,125,31,"+(1-p)+")";c.font="bold "+Math.round(M.ob*.5)+"px Arial,sans-serif";c.textAlign="center";c.textBaseline="middle";c.fillText("+1",f.x,f.y-M.ob*(.5+p*.8));
    }else if(f.type==="faux"){
      c.strokeStyle="rgba(140,135,120,"+(1-p)*.8+")";c.lineWidth=5;c.beginPath();c.arc(f.x,f.y,M.ob*(.35+p*.6),0,7);c.stroke();
    }else if(f.type==="choc"){
      for(var k=0;k<6;k++){var a=k*1.047+.3,d=M.ob*(.3+p*.8);etoile(c,f.x+Math.cos(a)*d,f.y+Math.sin(a)*d*.7,M.ob*.11,"rgba(252,193,4,"+(1-p)+")");}
    }else{etoile(c,f.x,f.y-p*30,M.ob*.16*(1-Math.abs(p-.5)),"rgba(252,193,4,"+(1-p*.6)+")");}
  });
}
function etoile(c,x,y,r,col){c.fillStyle=col;c.beginPath();for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,q=(i%2)?r*.45:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}c.closePath();c.fill();}

/* =====================================================================================================
   ÉCRANS, BOUCLE, COMMANDES
   ===================================================================================================== */
function montrer(id){["menu","game","end"].forEach(function(k){$(k).style.display=(k===id)?(k==="menu"?"flex":"block"):"none";});majBoutonsVoix();envoyerHauteur();}
function majCompteur(anim){
  var g=G;if(!g)return;
  $("cTxt").textContent=CONFIG.lettre+" : "+g.pris+" / "+g.L.cible;
  $("cJ").style.width=Math.round(100*g.pris/g.L.cible)+"%";
  if(anim){var e=$("cpt");e.classList.add("plus");setTimeout(function(){e.classList.remove("plus");},180);}
}
function boucle(t){
  raf=requestAnimationFrame(boucle);
  var dt=dernier?Math.min(.05,(t-dernier)/1000):0;dernier=t;     /* vitesse calculée sur le temps écoulé, jamais sur le nombre d'images */
  var g=G;if(!g)return;
  if(g.etat!=="pause")majLogique(g,dt);
  dessiner();
}
function lancerBoucle(){if(!raf){dernier=0;raf=requestAnimationFrame(boucle);}}
function arreterBoucle(){if(raf){cancelAnimationFrame(raf);raf=0;}}
function fermerVoiles(){["ovIntro","ovCrash","ovPause"].forEach(function(k){$(k).classList.remove("on");});}

function demarrerNiveau(i){
  Voix.stop();Sfx.reveil();
  G=nouvellePartie(i);
  $("hLv").textContent="Niveau "+(i+1);$("hNm").textContent=G.L.nom;
  $("cd").textContent="";$("iGo").hidden=true;
  majCompteur(false);fermerVoiles();
  montrer("game");redimensionner();
  $("ovIntro").classList.add("on");
  lancerBoucle();
  /* Début de manche, sans encart : (première manche) la consigne, puis le compte à rebours 3, 2, 1, puis « C'est parti ! »,
     et la route démarre. Si le navigateur refuse la lecture automatique, un bouton « C'est parti ! » laisse l'enfant démarrer. */
  var my=G,parti=false;
  function vivant(){return G===my&&my.etat==="intro";}
  function partir(){if(parti||!vivant())return;parti=true;$("cd").textContent="";$("ovIntro").classList.remove("on");my.etat="jeu";}
  function bloque(){if(!vivant())return;$("cd").textContent="";$("iGo").hidden=false;$("iGo").onclick=function(){$("iGo").hidden=true;compter(3);};}
  function compter(k){
    if(!vivant())return;
    var e=$("cd");
    if(k===0){e.textContent="";if(Voix.has("parti")){Voix.play("parti",partir,partir);setTimeout(partir,4000);}else setTimeout(partir,250);return;}
    e.textContent=k;e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop");Sfx.tic();
    setTimeout(function(){compter(k-1);},850);
  }
  setTimeout(function(){
    if(!vivant())return;
    if(!consigneDite&&Voix.has("consigne")){consigneDite=true;Voix.play("consigne",function(){setTimeout(function(){compter(3);},300);},bloque);}
    else{consigneDite=true;compter(3);}
  },350);
}
function pause(on){
  var g=G;if(!g)return;
  if(on){
    if(g.etat!=="jeu")return;
    g.avant="jeu";g.etat="pause";Voix.stop();$("ovPause").classList.add("on");$("resume").focus();
  }else{
    if(g.etat!=="pause")return;
    g.etat=g.avant||"jeu";dernier=0;$("ovPause").classList.remove("on");
  }
}
function finNiveau(g){
  var dernierNiveau=g.i>=CONFIG.niveaux.length-1;
  arreterBoucle();Voix.stop();fermerVoiles();
  $("endTitre").textContent=dernierNiveau?CONFIG.titreFin:"Bravo !";
  $("endSub").textContent=dernierNiveau?CONFIG.msgFin:"Niveau terminé !";
  $("lvName").textContent="Niveau "+(g.i+1)+" · "+g.L.nom;
  $("endLab").textContent="Lettres "+CONFIG.lettre+" attrapées";
  $("endGood").textContent=g.pris;$("endTot").textContent=g.L.cible;
  $("next").hidden=dernierNiveau;
  $("replay").className=dernierNiveau?"btn go":"btn";
  var k=dernierNiveau?"fin":"niveau";$("vEnd").setAttribute("data-k",k);
  montrer("end");confettis();
  setTimeout(function(){if(G===g&&g.etat==="gagne")Voix.play(k);},450);
  if(dernierNiveau&&window.parent!==window){try{window.parent.postMessage({type:"pazapa-activite-terminee",jeu:CONFIG.idJeu,lettre:CONFIG.lettre},"*");}catch(e){}}
  (dernierNiveau?$("replay"):$("next")).focus();
}
function confettis(){
  var e=$("end"),old=e.querySelectorAll(".cf");for(var i=0;i<old.length;i++)old[i].remove();
  var cols=["#FCC104","#36BBD6","#DB2E38","#8dc63f","#f08a24"];
  for(var k=0;k<26;k++){var d=document.createElement("i");d.className="cf";d.style.left=(Math.random()*100)+"%";d.style.background=cols[k%cols.length];d.style.animationDelay=(Math.random()*.9)+"s";e.appendChild(d);}
}
function retourMenu(){Voix.stop();arreterBoucle();fermerVoiles();G=null;montrer("menu");}

/* --- commandes : clavier (flèches) et deux grands boutons tactiles ; un appui = une voie --- */
document.addEventListener("keydown",function(e){
  if(!G||$("game").style.display==="none")return;
  if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
    e.preventDefault();
    if(e.repeat)return;                       /* touche maintenue : un seul déplacement */
    deplacer(e.key==="ArrowLeft"?-1:1);
  }else if(e.key==="Escape"||e.key==="p"||e.key==="P"){
    if(G.etat==="jeu")pause(true);else if(G.etat==="pause")pause(false);
  }
});
[["bL",-1],["bR",1]].forEach(function(p){
  var b=$(p[0]);
  b.addEventListener("pointerdown",function(e){e.preventDefault();b.classList.add("down");deplacer(p[1]);});
  ["pointerup","pointerleave","pointercancel"].forEach(function(n){b.addEventListener(n,function(){b.classList.remove("down");});});
  b.addEventListener("click",function(e){if(e.detail===0)deplacer(p[1]);});     /* activation au clavier (Entrée / Espace) */
  b.addEventListener("contextmenu",function(e){e.preventDefault();});
});
$("stage").addEventListener("touchmove",function(e){e.preventDefault();},{passive:false});   /* pas de défilement involontaire pendant le jeu */

$("bPause").addEventListener("click",function(){if(G&&G.etat==="pause")pause(false);else pause(true);});
$("resume").addEventListener("click",function(){pause(false);});
$("bHome").addEventListener("click",retourMenu);
$("bSnd").addEventListener("click",function(){var on=Sfx.bascule();this.classList.toggle("off",!on);this.setAttribute("aria-pressed",on?"false":"true");});
$("bCons").addEventListener("click",function(){if(G&&(G.etat==="jeu"||G.etat==="pause"))Voix.play("consigne");});
$("start").addEventListener("click",function(){demarrerNiveau(sel);});
$("next").addEventListener("click",function(){var i=G?Math.min(CONFIG.niveaux.length-1,G.i+1):0;demarrerNiveau(i);});
$("replay").addEventListener("click",function(){var g=G;if(g&&g.i>=CONFIG.niveaux.length-1){retourMenu();}else demarrerNiveau(g?g.i:0);});
/* pause automatique quand l'onglet ou la fenêtre n'est plus actif : aucune collision pendant l'absence de l'enfant */
document.addEventListener("visibilitychange",function(){if(document.hidden)pause(true);});
window.addEventListener("blur",function(){pause(true);});
window.addEventListener("pagehide",function(){Voix.stop();});

/* --- accueil --- */
(function(){
  $("mNiv").textContent=CONFIG.etiquette;$("crashTxt").textContent=CONFIG.msgObstacle;
  CONFIG.niveaux.forEach(function(L,i){
    var b=document.createElement("button");b.type="button";b.className="chip";b.setAttribute("aria-pressed",i===sel?"true":"false");
    b.innerHTML="<small>Niveau "+(i+1)+"</small><b>"+L.nom+"</b>";
    b.addEventListener("click",function(){sel=i;var l=document.querySelectorAll(".chip");for(var k=0;k<l.length;k++)l[k].setAttribute("aria-pressed",k===i?"true":"false");});
    $("chips").appendChild(b);
  });
  /* illustration de l'accueil : la même petite voiture, sur un bout de route */
  var c=$("carHome").getContext("2d");
  c.fillStyle="#cfeab5";rr(c,0,0,300,200,24);c.fill();
  c.save();rr(c,0,0,300,200,24);c.clip();
  c.fillStyle="#e9eef2";c.fillRect(63,0,174,200);c.fillStyle="#9aa6b2";c.fillRect(70,0,160,200);
  c.fillStyle="#fff";c.fillRect(73,0,4,200);c.fillRect(223,0,4,200);for(var y=-10;y<200;y+=44){c.fillRect(121,y,5,24);c.fillRect(174,y,5,24);}
  c.fillStyle="#8fca6d";c.beginPath();c.arc(30,52,22,0,7);c.fill();c.fillStyle="#a8d985";c.beginPath();c.arc(24,46,11,0,7);c.fill();
  c.fillStyle="#a3d47f";c.beginPath();c.arc(262,140,12,0,7);c.arc(278,146,14,0,7);c.arc(270,132,11,0,7);c.fill();
  dessinerVoiture(c,150-33,58,66,107);
  c.restore();
})();

/* --- iframe Moodle : la hauteur réelle est transmise à la page parente --- */
function envoyerHauteur(){if(window.parent===window)return;try{window.parent.postMessage({type:"pazapa-hauteur",hauteur:Math.ceil(document.body.getBoundingClientRect().height),etape:"La route des lettres — lettre "+CONFIG.lettre},"*");}catch(e){}}
if(window.ResizeObserver)new ResizeObserver(envoyerHauteur).observe(document.body);
window.addEventListener("resize",function(){if($("game").style.display!=="none"&&$("game").style.display!=="")redimensionner();envoyerHauteur();});
window.addEventListener("load",function(){majBoutonsVoix();envoyerHauteur();});
majBoutonsVoix();

/* Lecture seule, pour les vérifications automatiques (n'agit pas sur le jeu) */
window.PAZAPA_ROUTE={etat:function(){var g=G;return g?{niveau:g.i+1,etat:g.etat,voie:g.voie,x:g.x,pris:g.pris,faux:g.faux,cible:g.L.cible,vitesse:g.L.vitesse,rang:g.rang,nObst:g.nObst,objets:g.objets.map(function(o){return {id:o.id,genre:o.genre,ch:o.ch||"",cible:!!o.cible,voie:o.voie,y:o.y/M.H};}),carY:M.carY/M.H}:null;},mesures:function(){return JSON.parse(JSON.stringify(M));}};
})();
</script>

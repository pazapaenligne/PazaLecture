<title>Pazapa — Léo et Fadi — Je compose des mots</title>
<!--
  PAZAPA — Je lis avec Léo et Fadi — Niveau 1 — BOUTON 4 « Je compose des mots »
  MODÈLE RÉUTILISABLE : la composition de mots commencera avec la lettre L (manuel p. 18).
  Pour la lettre I, ce fichier ne contient qu'une DÉMONSTRATION du fonctionnement (IL, RI),
  ce n'est pas un exercice officiel de la leçon.

  FICHIER UNIQUE : CSS + JavaScript + images intégrés. Aucune dépendance externe. Aucune voix générée par le navigateur.

  POUR CHANGER DE LETTRE / DE MOTS : ne modifier que le bloc <script id="PAZAPA_CONFIG"> (données).
  Le bloc suivant (moteur du jeu) n'a pas à être réécrit.

  Intégration Moodle (iframe) : le jeu envoie sa hauteur au parent
    window.parent.postMessage({type:'pazapa-hauteur', hauteur: N, etape: ...}, '*')
    window.addEventListener('message', function(e){
      if(e.data && e.data.type==='pazapa-hauteur'){
        document.getElementById('IDENTIFIANT_IFRAME').style.height = e.data.hauteur + 'px';
      }
    });
  Pas de lien de retour vers la montagne dans ce jeu.
-->
<style>
:root{
  --bleu:#36BBD6; --bleu-clair:#E4F7FB;
  --vert:#C9D646; --vert-clair:#F3F7DD; --vert-fonce:#8FAE1B;
  --jaune:#FCC104; --jaune-clair:#FFF3D6;
  --gris:#2E2E2D; --gris-clair:#EBEBEB;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;color:var(--gris);
  background:linear-gradient(160deg,var(--bleu-clair),var(--vert-clair));-webkit-tap-highlight-color:transparent}
#jeu{max-width:920px;margin:0 auto;padding:12px 12px 16px}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--bleu);outline-offset:3px}

#marque{text-align:center;margin:0 0 6px;line-height:0}
#marque img{height:clamp(32px,5.5vw,44px);width:auto;max-width:60%}


/* progression */
#haut{background:#fff;border-radius:22px;padding:10px 14px;box-shadow:0 3px 10px rgba(46,46,45,.08);margin-bottom:12px}
.etapes{display:flex;justify-content:center;gap:clamp(8px,3vw,22px);margin-bottom:8px}
.pastille{width:clamp(34px,8vw,46px);height:clamp(34px,8vw,46px);border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:bold;font-size:1.1rem;background:var(--gris-clair);color:#8a8a89;transition:all .3s}
.pastille.courante{background:var(--jaune);color:var(--gris);box-shadow:0 3px 0 #d9a403;transform:scale(1.12)}
.pastille.fait{background:var(--vert);color:var(--gris)}
.barre{height:10px;background:var(--gris-clair);border-radius:99px;overflow:hidden}
.barre i{display:block;height:100%;background:var(--bleu);border-radius:99px;transition:width .5s ease}

/* scène */
#scene{position:relative;background:#fff;border-radius:22px;padding:clamp(12px,3vw,24px);box-shadow:0 3px 10px rgba(46,46,45,.08)}
.ecran{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:2px 0}
.consigne{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.groupe-consigne{display:flex;align-items:center;justify-content:center;gap:8px;flex:0 1 auto}
.groupe-consigne p{margin:0}
.titre-manche{font-size:clamp(1.1rem,3.2vw,1.5rem);font-weight:bold;text-align:center}
.pazita{height:clamp(40px,7vw,52px);width:auto;display:block;flex:none}

/* boutons */
.btn{border:0;border-radius:16px;padding:14px 26px;font-size:clamp(1.05rem,3vw,1.3rem);font-weight:bold;min-height:56px;transition:transform .15s,box-shadow .15s}
.btn.principal{background:var(--jaune);color:var(--gris);box-shadow:0 5px 0 #d9a403}
.btn.principal:active{transform:translateY(3px);box-shadow:0 2px 0 #d9a403}
.btn.second{background:#fff;color:var(--gris);border:3px solid var(--bleu)}
.btn.petit{padding:10px 18px;font-size:clamp(.9rem,2.6vw,1.05rem);min-height:44px;border-width:2px;font-weight:normal}
.son{background:#fff;border:2px solid var(--bleu);border-radius:50%;width:44px;height:44px;line-height:1;padding:0;opacity:.95;flex:none;color:var(--bleu);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.son .ico{display:inline-flex}
.son.joue{background:var(--jaune);border-color:var(--jaune)}
.son.large{width:auto;border-radius:24px;padding:0 18px;font-size:1rem;font-weight:bold;height:44px;color:var(--gris)}
.son.large .ico{color:var(--bleu)}
.actions{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}
.outils{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:10px;min-height:44px}
.verrou .btn,.verrou .son{opacity:.55;cursor:default}

/* accueil */
#haut:has(.tete-accueil){background:none;box-shadow:none;padding:0;margin-bottom:8px}
.tete-accueil{display:flex;flex-direction:column;align-items:center;gap:6px}
.tete-accueil .niveau{margin:0;font-size:.8rem;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;color:#6a6a69}
.tete-accueil h1{margin:0;text-align:center;background:var(--bleu-clair);border:3px dotted var(--bleu);border-radius:22px;
  padding:8px clamp(16px,4vw,36px);font-size:clamp(1.5rem,5vw,2.4rem);color:var(--gris);line-height:1.15}
.phrase-accueil{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,16px);margin-top:6px}
.phrase-accueil .pazita{height:clamp(52px,10vw,76px)}
.phrase-accueil p.preparation{white-space:normal;text-align:center}
.phrase-accueil p{margin:0;white-space:nowrap;font-weight:bold;font-size:clamp(.66rem,3vw,1.3rem);color:var(--gris)}

/* manche : illustration, mot modèle, cases, lettres mobiles */
.illustration{max-height:clamp(90px,20vw,150px);width:auto;max-width:60%;border-radius:18px;object-fit:contain}
.modele{display:flex;justify-content:center;gap:clamp(8px,2vw,16px);background:var(--bleu-clair);border:3px dotted var(--bleu);border-radius:22px;
  padding:8px clamp(18px,5vw,40px);font-size:clamp(2.2rem,9vw,4rem);font-weight:bold;letter-spacing:.04em;line-height:1.15;color:var(--gris);
  transition:box-shadow .25s,border-color .25s}
.rang-cases,.plateau-lettres{display:flex;justify-content:center;gap:clamp(8px,2.2vw,16px);width:100%;max-width:560px}
.case,.tuile-l{flex:0 1 clamp(64px,16vw,104px);min-width:0;aspect-ratio:1/1;border-radius:22%;padding:0;
  font-size:clamp(2rem,8vw,3.4rem);font-weight:bold;line-height:1;color:var(--gris);position:relative;user-select:none;-webkit-user-select:none}
.case{background:#fff;border:4px dashed var(--bleu);transition:border-color .25s,background .25s,box-shadow .25s}
.case.rempli{background:var(--bleu-clair);border-style:solid;touch-action:none;cursor:grab}
.case.cible{border-color:var(--jaune);background:var(--jaune-clair)}
.tuile-l{background:#fff;border:4px solid var(--gris-clair);box-shadow:0 4px 0 var(--gris-clair);touch-action:none;cursor:grab;transition:border-color .2s,box-shadow .2s,transform .2s}
.tuile-l.choisie{border-color:var(--jaune);box-shadow:0 4px 0 #d9a403;transform:translateY(-4px)}
.tuile-l.utilisee{visibility:hidden}
.tuile-l.tire,.case.tire{opacity:.35}
.glisse{position:fixed;z-index:50;pointer-events:none;width:clamp(64px,16vw,104px);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  background:#fff;border:4px solid var(--jaune);border-radius:20px;font-size:clamp(2rem,8vw,3.4rem);font-weight:bold;box-shadow:0 10px 24px rgba(46,46,45,.25);
  transform:translate(-50%,-50%)}

/* aides : contours fixes, jamais de clignotement ni de pulsation */
.indice{border-color:var(--bleu)!important;box-shadow:0 0 0 6px var(--bleu)}
.indice-fort{border-color:var(--jaune)!important;box-shadow:0 0 0 7px var(--jaune)}

/* validation douce */
.case.ok{border-color:var(--vert)!important;border-style:solid;background:var(--vert-clair)!important;box-shadow:0 0 0 5px rgba(201,214,70,.55);pointer-events:none}
.modele.ok{border-color:var(--vert);box-shadow:0 0 0 5px rgba(201,214,70,.45)}
.rang-cases.ok::after{content:none}

/* retour pédagogique : message doux, jamais de croix ni de rouge, aucun clignotement */
.retour:empty{display:none}
.retour{width:100%;max-width:560px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:0}
.retour p{margin:0;font-weight:bold;font-size:clamp(1.05rem,3.4vw,1.4rem);line-height:1.25;border-radius:18px;padding:8px 16px;text-align:center}
.retour.essaie p{background:var(--jaune-clair);border:3px solid var(--jaune)}
.retour.bravo p{background:var(--vert-clair);border:3px solid var(--vert)}
.case.essaie{border-style:solid;border-color:var(--jaune);background:var(--jaune-clair)}

/* mot prononcé */
.ligne-mot{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,14px)}

/* fin */
.persos{display:flex;gap:clamp(8px,3vw,28px);justify-content:center;align-items:flex-end}
.persos img{height:clamp(120px,22vw,170px);width:auto;display:block}
.fin h1{margin:0;font-size:clamp(1.3rem,4.4vw,2.1rem)}

@keyframes entree{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ecran{animation:entree .3s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<!-- ==========================================================================
     MOTEUR DU JEU — ne dépend que de CONFIG ci-dessus.
     ========================================================================== -->
<script>
(function(){
'use strict';
const C = CONFIG, T = C.textes, AUDIO = C.audio, IMG = C.images;
const scene = document.getElementById('scene'), haut = document.getElementById('haut'), jeu = document.getElementById('jeu');

/* manches du mode choisi (mode élève vide → message de préparation, jamais la démonstration) */
const modeActif = C.mode;
const MANCHES = (C.manches[modeActif] || []).filter(m=>m && m.mot);

/* ---------- outils ---------- */
function h(tag, attrs){
  const e = document.createElement(tag), a = attrs || {};
  for(const k in a){ const v = a[k]; if(v==null || v===false) continue;
    if(k==='class') e.className = v; else if(k==='text') e.textContent = v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2), v); else e.setAttribute(k, v===true ? '' : v); }
  for(let i=2;i<arguments.length;i++){ [].concat(arguments[i]).forEach(c=>{ if(c==null||c===false) return; e.append(c.nodeType ? c : document.createTextNode(c)); }); }
  return e;
}
const melanger = t => { const a = t.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };

/* moteur audio : une seule voix à la fois, jamais de superposition, jamais de musique */
const Son = (function(){
  let el = null, fin = null, filet = null, libres = [];
  const DELAI_SECOURS = 20000;      /* secours seulement : si un fichier ne se charge pas ou ne signale jamais sa fin, on ne bloque pas l'enfant */
  function liberer(){ const l = libres; libres = []; l.forEach(f=>f()); }
  function stopper(){ clearTimeout(filet); filet = null; if(el){ try{ el.pause(); }catch(_){} el.onended = el.onerror = null; el = null; } if(fin){ const f = fin; fin = null; f(); } }
  function arreter(){ stopper(); liberer(); }
  function jouer(src){
    stopper();
    if(!src){ liberer(); return Promise.resolve(); }
    return new Promise(res=>{
      const a = new Audio(src); el = a; fin = res;
      const fini = ()=>{ clearTimeout(filet); filet = null; if(el===a){ el = null; } if(fin===res){ fin = null; } res(); liberer(); };   /* la fin RÉELLE (ended) fait avancer la suite */
      a.onended = a.onerror = fini;
      filet = setTimeout(fini, DELAI_SECOURS);
      const p = a.play(); if(p && p.catch) p.catch(fini);
    });
  }
  /* se résout quand aucun audio n'est en cours : les audios automatiques s'enchaînent sans jamais s'interrompre ni se superposer */
  function libre(){ return el ? new Promise(r=>libres.push(r)) : Promise.resolve(); }
  return { jouer, arreter, libre };
})();

const Etat = { verrou:false };
let ecranId = 0;
let apresGlisse = false;                                  // vrai entre la fin d'un glissement et l'interaction suivante
window.addEventListener('pointerdown',()=>{ apresGlisse = false; },true);   // toute nouvelle interaction (souris ou doigt) lève la protection
const clicParasite = e => { if(!apresGlisse || e.detail===0) return false; apresGlisse = false; return true; };   // consomme le clic hérité du glissement
let annulerGeste_ecran = null;                            // annule un glisser en cours (fantôme + gestionnaires) quand l'écran change
function nouvelEcran(){ if(annulerGeste_ecran){ annulerGeste_ecran(); annulerGeste_ecran = null; } apresGlisse = false; ecranId++; Son.arreter(); Etat.verrou = false; jeu.classList.remove('verrou'); return ecranId; }
const attendre = (ms, id) => new Promise(r=>setTimeout(()=>r(id===undefined || id===ecranId),ms));
function verrouiller(v){ Etat.verrou = v; jeu.classList.toggle('verrou', v); }

/* rythme pédagogique (délais d'OBSERVATION, distincts de la durée des audios, dont la fin réelle est toujours détectée) */
const DELAI_OBSERVATION = 800;     /* avant de dire le mot / le message final */
const DELAI_APRES_CONSIGNE = 1500;   /* pause calme entre la fin réelle de la consigne et le mot */
const DELAI_REUSSITE = 1000;      /* avant et après l'audio de félicitations */

const faits = MANCHES.map(()=>false);
function renderHaut(courante){
  const n = faits.filter(Boolean).length;
  haut.replaceChildren(
    h('div',{class:'etapes'},MANCHES.map((_,i)=>h('div',{class:'pastille'+(faits[i]?' fait':i===courante?' courante':''),'aria-label':'Mot '+(i+1)},faits[i]?'★':String(i+1)))),
    h('div',{class:'barre'},h('i',{style:'width:'+Math.round(100*n/MANCHES.length)+'%'})));
}
/* icône haut-parleur unique, sobre (SVG, couleur du texte) : la même partout */
function iconeSon(){ const s = document.createElement('span'); s.className = 'ico';
  s.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.2 8.8a4.6 4.6 0 0 1 0 6.4M17.7 6.3a8.2 8.2 0 0 1 0 11.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'; return s; }
function btnSon(src, etiquette, label, cls){
  const b = h('button',{type:'button',class:'son '+(cls||''),'aria-label':label||'Écouter'},iconeSon(),etiquette||null);
  b.addEventListener('click',()=>{
    if(Etat.verrou) return;
    b.classList.add('joue'); const t = setTimeout(()=>b.classList.remove('joue'),600);
    Son.jouer(src).then(()=>{ clearTimeout(t); b.classList.remove('joue'); });
  });
  return b;
}
const pazita = () => h('img',{class:'pazita',src:IMG.pazita,alt:'Pazita avec sa carte',width:90,height:84,draggable:'false'});
function titreConsigne(texte, src){
  return h('div',{class:'consigne'}, btnSon(src,null,'Réécouter la consigne'),
    h('div',{class:'groupe-consigne'}, pazita(), h('p',{class:'titre-manche',text:texte})));
}
/* ==========================================================================
   ACCUEIL (aucun audio automatique)
   ========================================================================== */
function accueil(){
  nouvelEcran();
  for(let i=0;i<faits.length;i++) faits[i] = false;
  haut.replaceChildren(h('div',{class:'tete-accueil'},h('p',{class:'niveau',text:C.niveau}),h('h1',{text:T.titre})));
  if(!MANCHES.length){
    scene.replaceChildren(h('section',{class:'ecran accueil'},
      h('div',{class:'phrase-accueil'},pazita(),h('p',{class:'preparation',text:T.preparation}))));
    return;
  }
  scene.replaceChildren(h('section',{class:'ecran accueil'},
    h('div',{class:'phrase-accueil'},pazita(),h('p',{text:T.accueil})),
    h('div',{class:'actions'},
      btnSon(AUDIO.accueil,'Écouter','Écouter la présentation','large'),
      h('button',{type:'button',class:'btn principal',onclick:()=>manche(0)},'▶ Commencer'))));
}

/* ==========================================================================
   MANCHE : un mot à composer (illustration, mot modèle, cases, lettres mobiles)
   ========================================================================== */
function manche(m){
  const id = nouvelEcran();
  renderHaut(m);
  const cfg = MANCHES[m], lettres = Array.from(cfg.mot), n = lettres.length;

  /* lettres mobiles : celles du mot (mélangées, jamais dans l'ordre du mot si possible) ou la liste fournie */
  let source = (cfg.lettresMobiles && cfg.lettresMobiles.length) ? cfg.lettresMobiles.slice() : lettres.slice();
  let melange = melanger(source);
  for(let k=0;k<30 && melange.join('')===cfg.mot && source.length>1;k++) melange = melanger(source);
  const tuiles = melange.map((l,i)=>({id:i,lettre:l}));
  const cases = Array(n).fill(null);          // id de la tuile posée dans chaque case (ou null)
  let choisie = null, termine = false, aideN = 0, essais = 0;   // essais : compositions complètes incorrectes (aucune pénalité, simple suivi du message)

  /* ----- DOM ----- */
  const modele = h('div',{class:'modele','aria-label':'Mot modèle'},lettres.map(l=>h('span',{text:l})));
  const audioMot = AUDIO['mot'+cfg.mot] || null;      // le mot prononcé (s'il est enregistré)
  const ligneMot = h('div',{class:'ligne-mot'}, audioMot ? btnSon(audioMot,null,'Écouter le mot') : null, modele);
  const rangCases = h('div',{class:'rang-cases','aria-label':'Cases à remplir'});
  const plateau = h('div',{class:'plateau-lettres','aria-label':'Lettres mobiles'});
  const retour = h('div',{class:'retour','role':'status','aria-live':'polite'});   // message doux après une composition (bonne ou mauvaise)
  const zoneOutils = h('div',{class:'outils'},
    h('button',{type:'button',class:'btn second petit',onclick:demanderAide},'Besoin d’aide'),
    h('button',{type:'button',class:'btn second petit',onclick:()=>{ if(!Etat.verrou && !termine) manche(m); }},'↻ Recommencer'));
  scene.replaceChildren(h('section',{class:'ecran'},
    titreConsigne(T.consigne,AUDIO.consigne),
    cfg.image ? h('img',{class:'illustration',src:cfg.image,alt:'',draggable:'false'}) : null,
    ligneMot, rangCases, retour, plateau, zoneOutils));

  const boutonCase = i => h('button',{type:'button',class:'case','data-i':i,'aria-label':'Case '+(i+1)});
  const boutonTuile = t => h('button',{type:'button',class:'tuile-l','data-tid':t.id,'aria-label':'Lettre '+t.lettre},t.lettre);
  const caseEls = lettres.map((_,i)=>boutonCase(i)); rangCases.append(...caseEls);
  const tuileEls = tuiles.map(boutonTuile); plateau.append(...tuileEls);

  function maj(){
    caseEls.forEach((el,i)=>{
      const tid = cases[i];
      el.classList.toggle('rempli',tid!==null);
      el.textContent = tid!==null ? tuiles[tid].lettre : '';
      if(tid!==null) el.dataset.tid = tid; else delete el.dataset.tid;
      el.setAttribute('aria-label', tid!==null ? 'Case '+(i+1)+' : lettre '+tuiles[tid].lettre+' (toucher pour retirer)' : 'Case '+(i+1)+' vide');
    });
    tuileEls.forEach((el,k)=>{ el.classList.toggle('utilisee',cases.includes(k)); el.classList.toggle('choisie',choisie===k); });
  }
  function nettoyerIndices(){
    document.querySelectorAll('.indice,.indice-fort,.cible').forEach(e=>e.classList.remove('indice','indice-fort','cible'));
    aideN = 0;
    caseEls.forEach(e=>e.classList.remove('essaie'));
  }
  /* ----- actions sur l'état (jamais de pénalité : on peut tout retirer, tout déplacer) ----- */
  function poser(tid, i){
    if(termine || Etat.verrou) return;
    if(!Number.isInteger(tid) || tid<0 || tid>=tuiles.length || !Number.isInteger(i) || i<0 || i>=n) return;
    const ancienne = cases.indexOf(tid);              // case actuelle de cette tuile (-1 = elle est sur le plateau)
    const occupant = cases[i];                        // tuile déjà présente dans la case visée (ou null)
    if(ancienne===i){ choisie = null; maj(); return; }  // E : déposée sur sa propre case → aucun changement
    if(ancienne>=0) cases[ancienne] = occupant;       // C : l'ancienne case devient vide ; D : les deux tuiles échangent leur place
    /* B : si la tuile vient du plateau et que la case est occupée, l'occupant est simplement délogé :
       il n'est plus dans « cases », donc maj() le fait réapparaître, visible et sélectionnable, sur le plateau. */
    cases[i] = tid; choisie = null;
    cases.forEach((c,x)=>{ if(c!==null && cases.indexOf(c)!==x) cases[x] = null; });   // garde-fou : jamais une tuile dans deux cases
    nettoyerIndices(); maj(); verifier();
  }
  function retirer(i){
    if(termine || Etat.verrou || cases[i]===null) return;
    cases[i] = null; choisie = null; nettoyerIndices(); maj();
  }
  function verifier(){
    if(cases.some(c=>c===null)) return;
    if(cases.map(c=>tuiles[c].lettre).join('')===cfg.mot) reussir(); else corriger();
  }
  /* mot complet mais dans le mauvais ordre : message doux, lettres toujours manipulables, pas de passage au mot suivant, pas de pénalité */
  function afficherRetour(classe, texte){            // message écrit seul : aucun bouton audio dans les retours
    retour.className = 'retour '+classe;
    retour.replaceChildren(h('p',{text:texte}));
  }
  function corriger(){
    if(termine) return;
    essais++;
    caseEls.forEach(e=>e.classList.add('essaie'));                                   // contour jaune doux, fixe
    if(essais===1){
      afficherRetour('essaie',T.essaie);
      Son.jouer(AUDIO.encouragement);                                                  // encouragement dit une seule fois, à la 1re erreur
    } else {
      afficherRetour('essaie',T.modele);                                                    // 2e erreur et suivantes : message écrit seul, pas d'audio automatique
      modele.classList.add('indice');                                                  // le modèle est mis en évidence brièvement (contour fixe)
      const e = essais; attendre(2500,id).then(ok=>{ if(ok && essais===e) modele.classList.remove('indice'); });
    }                                                                                  // la réponse n'est jamais révélée automatiquement
  }
  async function reussir(){
    termine = true; verrouiller(true); nettoyerIndices();
    caseEls.forEach(e=>{ e.classList.remove('essaie'); e.classList.add('ok'); }); modele.classList.add('ok'); plateau.style.display = 'none';
    afficherRetour('bravo',T.reussite);   // le plateau est vide : on le masque
    faits[m] = true;
    if(!await attendre(DELAI_REUSSITE,id)) return;    // 1 s pour observer le mot vert
    renderHaut(m);
    await Son.libre(); if(id!==ecranId) return;       // ne jamais couper un audio en cours (ex. encouragement)
    await Son.jouer(AUDIO.reussite);                  // audio de félicitations existant : une fois par mot, jamais par lettre ; on attend sa fin
    if(id!==ecranId) return;
    if(!await attendre(DELAI_REUSSITE,id)) return;    // encore 1 s pour regarder le mot terminé
    verrouiller(false);
    zoneOutils.replaceChildren(h('button',{type:'button',class:'btn principal',onclick:()=>{ m<MANCHES.length-1 ? manche(m+1) : fin(); }},'Continuer ➜'));
  }

  /* ----- aides progressives, sans pénalité, contours fixes ----- */
  function prochaine(){            // première case dont la lettre n'est pas la bonne
    for(let i=0;i<n;i++){ if(cases[i]===null || tuiles[cases[i]].lettre!==lettres[i]) return i; }
    return -1;
  }
  function demanderAide(){
    if(Etat.verrou || termine) return;
    const i = prochaine(); if(i<0) return;
    const niveau = Math.min(aideN+1,3);
    document.querySelectorAll('.indice,.indice-fort,.cible').forEach(e=>e.classList.remove('indice','indice-fort','cible'));
    aideN = niveau;
    if(niveau===1){ modele.classList.add('indice'); Son.jouer(AUDIO.aide); return; }          // 1 : le mot modèle
    const voulue = lettres[i];
    /* la lettre à placer : de préférence dans le plateau, sinon une lettre posée dans une mauvaise case */
    let k = tuiles.findIndex(t=>t.lettre===voulue && !cases.includes(t.id));
    if(k<0) k = tuiles.findIndex(t=>t.lettre===voulue && cases.indexOf(t.id)!==i);
    if(k<0) return;
    const el = cases.includes(k) ? caseEls[cases.indexOf(k)] : tuileEls[k];
    el.classList.add('indice-fort');                                                          // 2 : la prochaine lettre
    if(niveau>=3) caseEls[i].classList.add('cible','indice-fort');                                 // 3 : la case correspondante
  }

  /* ----- toucher : sélectionner une lettre, puis la case (ou toucher une lettre posée pour la retirer) ----- */
  /* Anti-clic après un glissement : le « click » que le navigateur peut émettre à la fin d'un glissement est ignoré.
     Pas de délai arbitraire : le drapeau est levé dès que l'interaction suivante COMMENCE (nouveau pointerdown, souris ou doigt),
     ou consommé par le premier clic qui suit. Un clic clavier (detail = 0) n'est jamais bloqué. */
  tuileEls.forEach((el,k)=>el.addEventListener('click',e=>{
    if(clicParasite(e) || Etat.verrou || termine || cases.includes(k)) return;
    choisie = (choisie===k) ? null : k; maj();
  }));
  caseEls.forEach((el,i)=>el.addEventListener('click',e=>{
    if(clicParasite(e) || Etat.verrou || termine) return;
    if(choisie!==null) poser(choisie,i); else if(cases[i]!==null) retirer(i);
  }));

  /* ----- glisser-déposer (souris et tactile) ----- */
  let geste = null;                                         // un seul geste à la fois : { pid, annuler }
  const annulerGeste = ()=>{ if(geste) geste.annuler(); };
  annulerGeste_ecran = annulerGeste;                        // appelé au changement d'écran (Recommencer, manche suivante…)
  function brancherGlisse(el, tidDe){
    el.addEventListener('pointerdown',e=>{
      if(Etat.verrou || termine || (e.pointerType==='mouse' && e.button!==0)) return;
      if(geste) return;                                     // 2e doigt pendant un geste : ignoré
      const tid = tidDe(); if(tid==null) return;
      const x0 = e.clientX, y0 = e.clientY, pid = e.pointerId; let fantome = null;
      const bouge = ev=>{
        if(ev.pointerId!==pid) return;
        if(!fantome){
          if(Math.hypot(ev.clientX-x0,ev.clientY-y0)<8) return;
          fantome = h('div',{class:'glisse','aria-hidden':'true',text:tuiles[tid].lettre}); document.body.append(fantome);
          el.classList.add('tire'); choisie = null; maj();
        }
        fantome.style.left = ev.clientX+'px'; fantome.style.top = ev.clientY+'px';
      };
      const nettoyer = ()=>{                                // retire TOUS les gestionnaires temporaires et le fantôme
        window.removeEventListener('pointermove',bouge); window.removeEventListener('pointerup',fini); window.removeEventListener('pointercancel',fini);
        window.removeEventListener('lostpointercapture',fini); window.removeEventListener('blur',abandon);
        document.removeEventListener('visibilitychange',abandon);
        if(fantome){ fantome.remove(); fantome = null; }
        el.classList.remove('tire'); geste = null;
      };
      const abandon = ()=>{ const avait = !!fantome; nettoyer(); if(avait) apresGlisse = true; };   // état des lettres inchangé
      const fini = ev=>{
        if(ev.pointerId!==undefined && ev.pointerId!==pid) return;
        const avait = !!fantome;
        nettoyer();
        if(!avait) return;                                    // simple toucher : le « click » s'en charge
        apresGlisse = true;                                   // le clic éventuel qui suit ce glissement sera ignoré
        if(ev.type==='pointercancel' || ev.type==='lostpointercapture') return;   // geste annulé : état conservé
        const cible = document.elementFromPoint(ev.clientX,ev.clientY);
        const caseCible = cible && cible.closest('.case');
        const depuis = cases.indexOf(tid);
        if(caseCible && rangCases.contains(caseCible)) poser(tid, +caseCible.dataset.i);
        else if(depuis>=0) retirer(depuis);                   // lâché ailleurs : la lettre retourne parmi les lettres mobiles
      };
      geste = { pid, annuler: abandon };
      window.addEventListener('pointermove',bouge); window.addEventListener('pointerup',fini); window.addEventListener('pointercancel',fini);
      window.addEventListener('lostpointercapture',fini); window.addEventListener('blur',abandon); document.addEventListener('visibilitychange',abandon);
    });
  }
  tuileEls.forEach((el,k)=>brancherGlisse(el,()=>cases.includes(k)?null:k));
  caseEls.forEach((el,i)=>brancherGlisse(el,()=>cases[i]));

  maj();
  /* début de manche : 1) la manche est affichée ; 2) 800 ms pour observer ; 3) la consigne (1re manche seulement) jusqu'à sa FIN RÉELLE, pause de 1,5 s, puis le mot jusqu'à sa FIN RÉELLE ;
     4) l'enfant compose à son rythme. Manipulations bloquées pendant 2 et 3 (jamais définitivement : la fin d'un audio, même en échec, débloque). */
  (async()=>{
    const consigne = (m===0) ? AUDIO.consigne : null;
    if(!consigne && !audioMot) return;
    verrouiller(true);
    if(!await attendre(DELAI_OBSERVATION,id)) return;
    if(consigne){ await Son.libre(); if(id!==ecranId) return; await Son.jouer(consigne); if(id!==ecranId) return;
      if(audioMot && !await attendre(DELAI_APRES_CONSIGNE,id)) return; }     /* 1,5 s APRÈS la fin réelle (événement ended) de la consigne, puis le mot */
    if(audioMot){ await Son.libre(); if(id!==ecranId) return; await Son.jouer(audioMot); if(id!==ecranId) return; }
    verrouiller(false);
  })();
}

/* ==========================================================================
   FIN
   ========================================================================== */
function fin(){
  const id = nouvelEcran();
  renderHaut(-1);
  scene.replaceChildren(h('section',{class:'ecran fin'},
    h('div',{class:'persos'},h('img',{src:IMG.leo,alt:'Léo',draggable:'false'}),h('img',{src:IMG.fadi,alt:'Fadi',draggable:'false'})),
    h('h1',{text:T.finAffiche}),
    h('div',{class:'actions'},
      btnSon(AUDIO.fin,null,'Écouter le message de fin'),
      h('button',{type:'button',class:'btn second',onclick:accueil},'↻ Rejouer'))));
  /* 800 ms pour regarder Léo, Fadi et le message, puis l'audio final jusqu'à sa fin ; « Rejouer » reste utilisable (il coupe l'audio) */
  (async()=>{ if(!AUDIO.fin) return; if(!await attendre(DELAI_OBSERVATION,id)) return; await Son.libre(); if(id!==ecranId) return; await Son.jouer(AUDIO.fin); })();
}

/* hauteur automatique (iframe Moodle) */
function envoyerHauteur(){ if(window.parent===window) return;
  window.parent.postMessage({type:'pazapa-hauteur',hauteur:document.documentElement.scrollHeight,etape:'Je compose des mots'},'*'); }
if(window.ResizeObserver) new ResizeObserver(envoyerHauteur).observe(document.body);
window.addEventListener('load',envoyerHauteur);

accueil();
})();
</script>
</body>
</html>

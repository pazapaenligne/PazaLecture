<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pazapa — Léo et Fadi — Je lis</title>
<!--
  PAZAPA — Je lis avec Léo et Fadi — Niveau 1 — BOUTON 5 « Je lis » — LETTRE I
  ADAPTATION NUMÉRIQUE de familiarisation avec la lecture du graphème I et la production du phonème [i].
  Ce n'est PAS un exercice officiel du manuel : à ce stade, le manuel ne propose pas encore de lecture de syllabes, de mots ou de phrases
  (la lecture combinatoire commence avec la consonne L). Aucune syllabe, aucun mot, aucune phrase, aucune autre lettre, aucun score.

  FICHIER UNIQUE : CSS + JavaScript + images intégrés. Aucune dépendance externe. Aucune voix générée par le navigateur.
  Microphone FACULTATIF (étape 3) : l'enregistrement reste dans le navigateur (mémoire de la page), n'est jamais envoyé nulle part,
  n'est ni analysé ni noté. Refus ou absence de micro : le jeu continue (bouton « J'ai essayé » toujours disponible).

  POUR CHANGER DE LETTRE : ne modifier que le bloc <script id="PAZAPA_CONFIG"> (données).

  Intégration Moodle (iframe) :
    - hauteur : window.parent.postMessage({type:'pazapa-hauteur', hauteur: N, etape: ...}, '*')
        window.addEventListener('message', function(e){
          if(e.data && e.data.type==='pazapa-hauteur'){ document.getElementById('IDENTIFIANT_IFRAME').style.height = e.data.hauteur + 'px'; }
        });
    - microphone : l'iframe doit porter  allow="microphone"  (sinon le navigateur refuse l'accès : le jeu l'explique gentiment et continue).
  Pas de lien de retour vers la montagne dans ce jeu.
-->
<style>
:root{
  --bleu:#36BBD6; --bleu-clair:#E4F7FB;
  --vert:#C9D646; --vert-clair:#F3F7DD; --vert-fonce:#8FAE1B;
  --jaune:#FCC104; --jaune-clair:#FFF3D6;
  --gris:#2E2E2D; --gris-clair:#EBEBEB;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;color:var(--gris);
  background:linear-gradient(160deg,var(--bleu-clair),var(--vert-clair));-webkit-tap-highlight-color:transparent}
#jeu{max-width:920px;margin:0 auto;padding:12px 12px 16px}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--bleu);outline-offset:3px}

#marque{text-align:center;margin:0 0 6px;line-height:0}
#marque img{height:clamp(32px,5.5vw,44px);width:auto;max-width:60%}
#mode{text-align:center;margin:0 0 6px;min-height:0}
#mode span{display:inline-block;background:var(--jaune-clair);border:2px solid var(--jaune);color:var(--gris);border-radius:99px;
  font-size:.72rem;font-weight:bold;letter-spacing:.08em;text-transform:uppercase;padding:3px 12px}

/* progression */
#haut{background:#fff;border-radius:22px;padding:10px 14px;box-shadow:0 3px 10px rgba(46,46,45,.08);margin-bottom:12px}
.etapes{display:flex;justify-content:center;gap:clamp(8px,3vw,22px);margin-bottom:8px}
.pastille{width:clamp(34px,8vw,46px);height:clamp(34px,8vw,46px);border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:bold;font-size:1.1rem;background:var(--gris-clair);color:#8a8a89;transition:all .3s}
.pastille.courante{background:var(--jaune);color:var(--gris);box-shadow:0 3px 0 #d9a403;transform:scale(1.12)}
.pastille.fait{background:var(--vert);color:var(--gris)}
.barre{height:10px;background:var(--gris-clair);border-radius:99px;overflow:hidden}
.barre i{display:block;height:100%;background:var(--bleu);border-radius:99px;transition:width .5s ease}

/* scène */
#scene{position:relative;background:#fff;border-radius:22px;padding:clamp(12px,3vw,24px);box-shadow:0 3px 10px rgba(46,46,45,.08)}
.ecran{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:2px 0}
.consigne{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.groupe-consigne{display:flex;align-items:center;justify-content:center;gap:8px;flex:0 1 auto}
.groupe-consigne p{margin:0}
.titre-manche{font-size:clamp(1.1rem,3.2vw,1.5rem);font-weight:bold;text-align:center}
.pazita{height:clamp(40px,7vw,52px);width:auto;display:block;flex:none}

/* boutons */
.btn{border:0;border-radius:16px;padding:14px 26px;font-size:clamp(1.05rem,3vw,1.3rem);font-weight:bold;min-height:56px;transition:transform .15s,box-shadow .15s}
.btn.principal{background:var(--jaune);color:var(--gris);box-shadow:0 5px 0 #d9a403}
.btn.principal:active{transform:translateY(3px);box-shadow:0 2px 0 #d9a403}
.btn.second{background:#fff;color:var(--gris);border:3px solid var(--bleu)}
.btn.petit{padding:10px 18px;font-size:clamp(.9rem,2.6vw,1.05rem);min-height:44px;border-width:2px;font-weight:normal}
.son{background:var(--bleu-clair);border:2px solid var(--bleu);border-radius:50%;width:44px;height:44px;font-size:1.1rem;line-height:1;padding:0;opacity:.9;flex:none;color:var(--gris)}
.son.joue{background:var(--jaune);border-color:var(--jaune)}
.son.large{width:auto;border-radius:24px;padding:0 20px;font-size:1.05rem;font-weight:bold;height:48px}
.actions{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}
.outils{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:10px;min-height:44px}
.verrou .btn,.verrou .son{opacity:.55;cursor:default}
.zone-passer{display:flex;justify-content:center;margin:-4px 0 0}
.passer{background:none;border:0;color:#6a6a69;font-size:.85rem;text-decoration:underline;padding:8px 12px;min-height:36px}

/* accueil */
#haut:has(.tete-accueil){background:none;box-shadow:none;padding:0;margin-bottom:8px}
.tete-accueil{display:flex;flex-direction:column;align-items:center;gap:6px}
.tete-accueil .niveau{margin:0;font-size:.8rem;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;color:#6a6a69}
.tete-accueil h1{margin:0;text-align:center;background:var(--bleu-clair);border:3px dotted var(--bleu);border-radius:22px;
  padding:8px clamp(16px,4vw,36px);font-size:clamp(1.5rem,5vw,2.4rem);color:var(--gris);line-height:1.15}
.phrase-accueil{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,16px);margin-top:6px}
.phrase-accueil .pazita{height:clamp(52px,10vw,76px)}
.phrase-accueil p{margin:0;font-weight:bold;font-size:clamp(1rem,3.6vw,1.3rem);color:var(--gris);text-align:center;max-width:34ch}

/* grande lettre */
.lettre-cadre{background:var(--bleu-clair);border:3px dotted var(--bleu);border-radius:28px;display:flex;align-items:center;justify-content:center;
  width:clamp(160px,38vw,260px);height:clamp(190px,42vw,300px)}
.lettre-cadre span{font-size:clamp(7rem,30vw,12rem);font-weight:bold;line-height:1;color:#DB2E38}
.etiquette{margin:0;font-size:.8rem;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;color:#6a6a69}

/* microphone (facultatif) */
.micro{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:10px;background:#fff;border:3px dotted var(--bleu);border-radius:22px;padding:12px 14px}
.micro h2{margin:0;font-size:1rem;color:var(--gris)}
.micro .actions{gap:10px}
.micro .btn.petit{min-height:48px}
.micro .btn[hidden]{display:none}
.micro .btn.enregistre{background:#fff;border-color:var(--jaune);box-shadow:0 0 0 4px var(--jaune-clair)}
.aide-micro{margin:0;font-size:.95rem;color:#4a4a49;max-width:440px}

/* fin */
.persos{display:flex;gap:clamp(8px,3vw,28px);justify-content:center;align-items:flex-end}
.persos img{height:clamp(120px,22vw,170px);width:auto;display:block}
.fin h1{margin:0;font-size:clamp(1.3rem,4.4vw,2.1rem)}

@keyframes entree{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ecran{animation:entree .3s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<!-- ==========================================================================
     MOTEUR DU JEU — ne dépend que de CONFIG ci-dessus.
     ========================================================================== -->
<script>
(function(){
'use strict';
const C = CONFIG, T = C.textes, AUDIO = C.audio, IMG = C.images;
const scene = document.getElementById('scene'), haut = document.getElementById('haut'), jeu = document.getElementById('jeu');
const NB = 3;

function h(tag, attrs){
  const e = document.createElement(tag), a = attrs || {};
  for(const k in a){ const v = a[k]; if(v==null || v===false) continue;
    if(k==='class') e.className = v; else if(k==='text') e.textContent = v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2), v); else e.setAttribute(k, v===true ? '' : v); }
  for(let i=2;i<arguments.length;i++){ [].concat(arguments[i]).forEach(c=>{ if(c==null||c===false) return; e.append(c.nodeType ? c : document.createTextNode(c)); }); }
  return e;
}

/* moteur audio : une seule voix à la fois, jamais de superposition, jamais de musique */
const Son = (function(){
  let el = null, fin = null;
  function arreter(){ if(el){ try{ el.pause(); }catch(_){} el.onended = el.onerror = null; el = null; } if(fin){ const f = fin; fin = null; f(); } }
  function jouer(src){
    arreter();
    if(!src) return Promise.resolve();
    return new Promise(res=>{
      const a = new Audio(src); el = a; fin = res;
      const fini = ()=>{ if(el===a){ el = null; } if(fin===res){ fin = null; } res(); };
      a.onended = a.onerror = fini;
      const p = a.play(); if(p && p.catch) p.catch(fini);
    });
  }
  return { jouer, arreter };
})();

let ecranId = 0, nettoyageEcran = null;
function nouvelEcran(){ if(nettoyageEcran){ nettoyageEcran(); nettoyageEcran = null; } ecranId++; Son.arreter(); return ecranId; }

function renderHaut(courante, faites){
  haut.replaceChildren(
    h('div',{class:'etapes'},T.etapes.map((nom,i)=>h('div',{class:'pastille'+(i<faites?' fait':i===courante?' courante':''),'aria-label':'Étape '+(i+1)+' : '+nom},i<faites?'★':String(i+1)))),
    h('div',{class:'barre'},h('i',{style:'width:'+Math.round(100*faites/NB)+'%'})));
}
function btnSon(getSrc, etiquette, label, cls){
  const b = h('button',{type:'button',class:'son '+(cls||''),'aria-label':label||'Écouter'},etiquette||'🔊');
  b.addEventListener('click',()=>{
    b.classList.add('joue'); const t = setTimeout(()=>b.classList.remove('joue'),600);
    Son.jouer(typeof getSrc==='function' ? getSrc() : getSrc).then(()=>{ clearTimeout(t); b.classList.remove('joue'); });
  });
  return b;
}
const pazita = () => h('img',{class:'pazita',src:IMG.pazita,alt:'Pazita avec son livre',width:251,height:240,draggable:'false'});
function titreConsigne(texte, src){
  return h('div',{class:'consigne'}, btnSon(src,'🔊','Réécouter la consigne'),
    h('div',{class:'groupe-consigne'}, pazita(), h('p',{class:'titre-manche',text:texte})));
}
const grandeLettre = () => h('div',{class:'lettre-cadre','aria-label':'La lettre '+C.lettre},h('span',{text:C.lettre}));

/* ==========================================================================
   ACCUEIL (aucun audio automatique)
   ========================================================================== */
function accueil(){
  nouvelEcran();
  haut.replaceChildren(h('div',{class:'tete-accueil'},h('p',{class:'niveau',text:C.niveau}),h('h1',{text:T.titre})));
  scene.replaceChildren(h('section',{class:'ecran accueil'},
    h('div',{class:'phrase-accueil'},pazita(),h('p',{text:T.accueil})),
    h('div',{class:'actions'},
      btnSon(AUDIO.accueil,'🔊 Écouter','Écouter la présentation','large'),
      h('button',{type:'button',class:'btn principal',onclick:()=>etape(1)},'▶ Commencer'))));
}

/* ==========================================================================
   ÉTAPES 1 et 2 : J'observe, J'écoute (la consigne est dite à l'arrivée ; aucune question, aucun score)
   ========================================================================== */
function etape(n){
  if(n===3) return etape3();
  const id = nouvelEcran();
  renderHaut(n-1,n-1);
  const texte = n===1 ? T.observe : T.ecoute, src = n===1 ? AUDIO.observe : AUDIO.ecoute;
  const corps = [ titreConsigne(texte,src), grandeLettre() ];
  if(n===2) corps.push(h('div',{class:'actions'},btnSon(()=>AUDIO.phoneme,'🔊 '+T.ecouterSon,T.ecouterSon,'large')));   // le son ne se lance que sur demande
  corps.push(h('div',{class:'outils'},h('button',{type:'button',class:'btn principal',onclick:()=>etape(n+1)},'Continuer ➜')));
  scene.replaceChildren(h('section',{class:'ecran'},corps));
  Son.jouer(src);                                          // consigne dite une seule fois à l'arrivée (réécoutable avec 🔊)
}

/* ==========================================================================
   ÉTAPE 3 : Je lis — option A « J'ai essayé » (toujours disponible) ; option B microphone (facultative, local)
   ========================================================================== */
function etape3(){
  const id = nouvelEcran();
  renderHaut(2,2);
  const micro = creerMicro();
  nettoyageEcran = micro.nettoyer;
  scene.replaceChildren(h('section',{class:'ecran'},
    titreConsigne(T.lis,AUDIO.lis),
    grandeLettre(),
    h('div',{class:'actions'},h('button',{type:'button',class:'btn principal',onclick:()=>fin()},T.jaiEssaye)),
    micro.noeud));
  Son.jouer(AUDIO.lis);
}

/* enregistrement local facultatif : jamais envoyé, jamais analysé, jamais bloquant */
function creerMicro(){
  const noeud = h('div',{class:'micro'});
  let flux = null, rec = null, morceaux = [], url = null, lecteur = null, etat = 'repos', jeton = 0;
  const possible = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  const msg = h('p',{class:'aide-micro',role:'status'});
  const bStart = h('button',{type:'button',class:'btn second petit'},T.microStart);
  const bStop  = h('button',{type:'button',class:'btn second petit enregistre',hidden:true},T.microStop);
  const bEcoute= h('button',{type:'button',class:'btn second petit',hidden:true},T.microEcoute);
  const bRecom = h('button',{type:'button',class:'btn second petit',hidden:true},T.microRecom);
  const zone = h('div',{class:'actions'},bStart,bStop,bEcoute,bRecom);
  noeud.append(h('h2',{text:T.microTitre}),zone,msg);

  const montrer = (...bs)=>{ [bStart,bStop,bEcoute,bRecom].forEach(b=>b.hidden = !bs.includes(b)); };
  const arreterLecture = ()=>{ if(lecteur){ try{ lecteur.pause(); }catch(_){} lecteur.onended = null; lecteur = null; } };
  const libererFlux = ()=>{ if(flux){ flux.getTracks().forEach(t=>{ try{ t.stop(); }catch(_){} }); flux = null; } };
  const effacer = ()=>{ arreterLecture(); if(url){ URL.revokeObjectURL(url); url = null; } morceaux = []; };
  const indisponible = (texte)=>{ etat = 'indisponible'; montrer(); msg.textContent = texte; };

  async function demarrer(){
    if(etat==='enregistre' || etat==='demande') return;
    Son.arreter(); effacer(); const mon = ++jeton; etat = 'demande'; msg.textContent = '';
    try{
      const f = await navigator.mediaDevices.getUserMedia({audio:true});
      if(mon!==jeton){ f.getTracks().forEach(t=>t.stop()); return; }       // l'écran a changé pendant la demande
      flux = f; rec = new MediaRecorder(f);
      rec.ondataavailable = e=>{ if(e.data && e.data.size) morceaux.push(e.data); };
      rec.onstop = ()=>{
        libererFlux();
        if(mon!==jeton) return;
        if(!morceaux.length){ etat = 'repos'; montrer(bStart); msg.textContent = ''; return; }
        url = URL.createObjectURL(new Blob(morceaux,{type:(rec && rec.mimeType) || 'audio/webm'}));
        etat = 'pret'; montrer(bEcoute,bRecom); msg.textContent = '';
      };
      rec.start(); etat = 'enregistre'; montrer(bStop); msg.textContent = T.microAttente;
    }catch(_){ libererFlux(); if(mon===jeton) indisponible(T.microRefus); }
  }
  function arreter(){ if(etat==='enregistre' && rec && rec.state!=='inactive'){ try{ rec.stop(); }catch(_){ libererFlux(); etat='repos'; montrer(bStart); } } }
  function ecouter(){
    if(!url) return; Son.arreter(); arreterLecture();
    const a = new Audio(url); lecteur = a; a.onended = ()=>{ if(lecteur===a) lecteur = null; };
    const p = a.play(); if(p && p.catch) p.catch(()=>{ lecteur = null; });
  }
  function recommencer(){ effacer(); etat = 'repos'; montrer(bStart); msg.textContent = ''; }

  bStart.addEventListener('click',demarrer); bStop.addEventListener('click',arreter);
  bEcoute.addEventListener('click',ecouter); bRecom.addEventListener('click',recommencer);

  if(!possible) indisponible(T.microRefus); else msg.textContent = '';
  const nettoyer = ()=>{ jeton++; if(rec && rec.state!=='inactive'){ try{ rec.onstop = null; rec.stop(); }catch(_){} } libererFlux(); effacer(); };
  return { noeud, nettoyer };
}

/* ==========================================================================
   FIN
   ========================================================================== */
function fin(){
  const id = nouvelEcran();
  renderHaut(-1,NB);
  scene.replaceChildren(h('section',{class:'ecran fin'},
    h('div',{class:'persos'},h('img',{src:IMG.leo,alt:'Léo',draggable:'false'}),h('img',{src:IMG.fadi,alt:'Fadi',draggable:'false'})),
    h('div',{class:'groupe-consigne'},pazita(),h('h1',{text:T.fin})),
    h('div',{class:'actions'},
      btnSon(()=>AUDIO.phoneme,'🔊 '+T.reecouterSon,T.reecouterSon,'large'),
      h('button',{type:'button',class:'btn second',onclick:()=>etape(1)},'↻ '+T.recommencer))));
  Son.jouer(AUDIO.felicitations);                          // une seule fois ; les boutons restent utilisables
}

function envoyerHauteur(){ if(window.parent===window) return;
  window.parent.postMessage({type:'pazapa-hauteur',hauteur:document.documentElement.scrollHeight,etape:'Je lis'},'*'); }
if(window.ResizeObserver) new ResizeObserver(envoyerHauteur).observe(document.body);
window.addEventListener('load',envoyerHauteur);

accueil();
})();
</script>
</body>

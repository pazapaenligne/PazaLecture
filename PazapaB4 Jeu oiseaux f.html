<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAZAPA Lecture — Le jeu des oiseaux — Son F</title>
<style>
:root{--bleu:#36BBD6;--bleu-clair:#E4F7FB;--vert:#C9D646;--vert-clair:#F3F7DD;--jaune:#FCC104;--jaune-clair:#FFF3D6;--rouge:#DB2E38;--gris:#2E2E2D;--gris-clair:#EBEBEB;--font:Arial,"Helvetica Neue",Helvetica,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:linear-gradient(160deg,var(--bleu-clair) 0%,var(--vert-clair) 100%) no-repeat fixed}
body{margin:0;font-family:var(--font);color:var(--gris);overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
.cache{display:none!important}
#app{max-width:900px;margin:0 auto;padding:8px 14px 14px}
#marque{text-align:center;margin:0 0 6px;line-height:0}
#marque img{height:clamp(28px,5vw,38px);width:auto;max-width:60%}
.carte{background:#fff;border-radius:18px;box-shadow:0 2px 8px rgba(46,46,45,.12);padding:10px 14px;margin:0 0 8px;text-align:center}
.sur-titre{margin:0 0 4px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:bold;color:#5d6b6e}
.titre{display:inline-block;margin:0;background:var(--bleu-clair);border:3px dotted var(--bleu);border-radius:16px;padding:6px 20px;font-size:clamp(1.3rem,4.6vw,2.1rem);line-height:1.15}
.btn{border:0;border-radius:18px;font-weight:bold;padding:10px 24px;font-size:clamp(1.05rem,3.4vw,1.3rem);background:var(--jaune);color:var(--gris);box-shadow:0 4px 0 #d9a403;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9a403}
.btn.second{background:var(--bleu-clair);border:2px solid var(--bleu);box-shadow:none}
.btn.petit{min-height:46px;padding:6px 14px;font-size:1rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn:focus-visible,.son:focus-visible,.oiseau:focus-visible,.opt input:focus-visible{outline:4px solid var(--gris);outline-offset:2px}
.son{background:var(--bleu-clair);border:2px solid var(--bleu);border-radius:24px;min-height:48px;padding:0 20px;font-size:1.05rem;font-weight:bold;display:inline-flex;align-items:center;justify-content:center}
.son .ico{font-size:1.5rem;line-height:1;margin-right:10px}
.son.joue{background:var(--jaune);border-color:var(--jaune)}
.actions{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:10px}
.persos{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,4vw,34px)}
.persos img{height:clamp(100px,24vw,160px);width:auto;object-fit:contain}
.grandR{font-size:clamp(84px,22vw,140px);font-weight:bold;color:#3F5FBF;line-height:.9}
.texte{font-size:clamp(1.05rem,3.4vw,1.4rem);font-weight:bold;margin:10px auto 0;max-width:24em}
.options{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;align-items:center;margin:0 0 8px}
.opt{display:inline-flex;align-items:center;gap:8px;font-weight:bold;font-size:.95rem;min-height:44px;cursor:pointer}
.opt input{width:24px;height:24px;accent-color:#1586a0}
.infos{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:6px}
.pilule{background:#fff;border:2px solid var(--bleu);border-radius:16px;padding:6px 14px;font-weight:bold;min-height:44px;display:inline-flex;align-items:center}
.pilule.jaune{background:var(--jaune-clair);border-color:var(--jaune)}
.consigne{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.consigne img{height:50px;width:auto}
.consigne p{margin:0;font-size:clamp(1.05rem,3.4vw,1.4rem);font-weight:bold}
.ciel{position:relative;overflow:hidden;border:3px solid var(--bleu);border-radius:22px;height:clamp(340px,56vw,480px);background:linear-gradient(#bfeaf6,#eefaff 80%,#f3f8df);touch-action:manipulation}
.nuage{position:absolute;pointer-events:none;background:#fff;opacity:.7;border-radius:40px;height:34px}
.nuage::before,.nuage::after{content:"";position:absolute;background:#fff;border-radius:50%}
.nuage::before{width:46px;height:46px;left:14px;top:-22px}.nuage::after{width:34px;height:34px;left:50px;top:-12px}
.oiseau{position:absolute;left:0;top:0;width:clamp(72px,11vw,96px);height:clamp(72px,11vw,96px);padding:0;border:0;background:transparent;border-radius:50%;will-change:transform;touch-action:manipulation}
.oiseau svg{width:100%;height:100%;display:block;overflow:visible}
.oiseau .pulse{transform-origin:50% 50%}
.oiseau.ok .pulse{animation:pulse .6s ease}
.oiseau.ok .badge{fill:var(--vert-clair);stroke:#7C8A12}
.oiseau.ok::after{content:"✓";position:absolute;right:-2px;top:-8px;font-size:26px;font-weight:bold;color:#628416;line-height:1;text-shadow:0 0 3px #fff}
.oiseau.etoile .lettre{fill:var(--jaune);stroke:#D9A400;stroke-width:2}
.oiseau.brille{filter:drop-shadow(0 0 0 #fff);outline:5px solid var(--gris);outline-offset:3px;box-shadow:0 0 0 9px var(--jaune)}
.oiseau:disabled{opacity:1;cursor:default}
.pluie{position:absolute;color:var(--jaune);font-size:20px;pointer-events:none;animation:monte 1s ease-out forwards}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes monte{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}
.bas{margin-top:8px;display:flex;flex-direction:column;align-items:center;gap:8px}
.msg{display:flex;align-items:center;gap:10px;background:var(--jaune-clair);border:2px solid var(--jaune);border-radius:22px;padding:4px 14px 4px 8px;min-height:60px;width:100%;max-width:680px}
.msg img.abeille{height:46px;width:auto}
.msg p{flex:1;margin:0;text-align:center;font-size:clamp(1rem,3.2vw,1.3rem);line-height:1.2;font-weight:bold}
.ciel>.modele{position:absolute;top:8px;left:8px;z-index:5;box-shadow:0 3px 10px rgba(46,46,45,.15)}
.modele{font-size:42px;font-weight:bold;color:#3F5FBF;line-height:1;background:#fff;border:3px solid #3F5FBF;border-radius:14px;padding:2px 14px;font-family:var(--font)}
.fin-ecran h1{margin:8px 0 4px;font-size:clamp(1.6rem,6vw,2.4rem)}
.fin-ecran .sous{margin:0 0 6px;font-size:clamp(1.1rem,3.8vw,1.5rem);font-weight:bold}
.ciel-fin{position:relative;overflow:hidden;width:100%;border-radius:22px;padding:clamp(14px,3vw,24px) 12px 16px;background:linear-gradient(180deg,#BDE4F7,#FFF6D8);display:flex;flex-direction:column;align-items:center;gap:8px}
.ciel-fin>*:not(.etoile-fin){position:relative;z-index:1}
.ligne-bravo{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.ligne-bravo img{height:78px;width:auto}
.ligne-bravo h1{margin:0;font-size:clamp(1.3rem,4.6vw,2.1rem)}
.fin-sous{margin:6px 0 0;font-size:clamp(18px,3.4vw,24px);font-weight:700}
.etoile-fin{position:absolute;top:-8%;color:#FCC104;line-height:1;text-shadow:0 0 4px #fff,0 0 8px rgba(252,193,4,.8);pointer-events:none;animation:chute 3.4s ease-in forwards}
@keyframes chute{0%{opacity:0;transform:translateY(0) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translateY(430px) rotate(180deg)}}
body.reduit *{animation:none!important;transition:none!important}
/* niveau 3 (18 oiseaux) : zone plus haute et oiseaux un peu plus petits sur tablette et petit écran, pour que rien ne se gêne */
.ciel.n3{height:clamp(440px,70vw,540px)}
.ciel.n3 .oiseau{width:clamp(62px,9.5vw,88px);height:clamp(62px,9.5vw,88px)}
@media (max-width:520px){.ciel{height:470px}.ciel.n3{height:600px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>

const NS = 'http://www.w3.org/2000/svg';
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const k in (attrs||{})){ const v = attrs[k];
    if(k==='text') e.textContent = v; else if(k==='class') e.className = v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  kids.forEach(c=>{ if(c) e.append(c); }); return e;
}
function sv(tag, attrs){ const e = document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
const img = (src,alt)=> h('img',{src,alt:alt||'',draggable:'false'});
const rnd = (a,b)=> a+Math.random()*(b-a);
const melanger = t=>{ const a = t.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const scene = document.getElementById('scene');
let run = 0, timers = [];
function tm(fn,ms){ const r = run; const id = setTimeout(()=>{ if(r===run) fn(); },ms); timers.push(id); return id; }
let nettoyageNiveau = null;
function nettoyer(){ run++; timers.forEach(clearTimeout); timers = []; if(nettoyageNiveau){ nettoyageNiveau(); nettoyageNiveau = null; } Voix.arreter(); Sfx.arreter(); Buzz.arreter(); }

/* Voix : une seule à la fois ; une lecture = un identifiant, finalisée une fois ; bouton remis à « Écouter » dès l'interruption */
const Voix = (function(){
  let cour = null, gen = 0;
  function clore(c){ if(!c || c.fini) return; c.fini = true; c.a.onended = c.a.onerror = null; if(cour===c) cour = null; if(c.fin){ try{ c.fin(); }catch(_){} } }
  function arreter(){ const c = cour; if(!c) return; try{ c.a.pause(); }catch(_){} clore(c); }
  function jouer(src,fin){ arreter(); Sfx.arreter(); Buzz.arreter(); if(!src) return; let x; try{ x = new Audio(src); }catch(_){ return; }
    const c = { id:++gen, a:x, fin, fini:false }; cour = c; x.onended = x.onerror = ()=>clore(c);
    try{ const p = x.play(); if(p && p.catch) p.catch(()=>clore(c)); }catch(_){ clore(c); } }
  return { jouer, arreter, occupe:()=>cour!==null };
})();
function btnSon(src,label){
  if(!src) return null;
  const lib = h('span',{text:'Écouter'}); const b = h('button',{type:'button',class:'son','aria-label':label||'Écouter'}, h('span',{class:'ico','aria-hidden':'true',text:'🔊'}), lib);
  b.addEventListener('click',()=>{ Voix.jouer(src,()=>{ b.classList.remove('joue'); lib.textContent='Écouter'; }); if(Voix.occupe()){ b.classList.add('joue'); lib.textContent='Écoute…'; } });
  return b;
}
/* Bruitage de validation : court, discret, jamais pendant une voix ; redémarre proprement si plusieurs L sont trouvés vite */
const Sfx = (function(){
  let el = null;
  function jouer(){ if(!AUDIO.valide || Voix.occupe()) return; try{ if(!el) el = new Audio(AUDIO.valide); el.pause(); el.currentTime = 0; const p = el.play(); if(p && p.catch) p.catch(()=>{}); }catch(_){} }
  function arreter(){ if(el){ try{ el.pause(); }catch(_){} } }
  return { jouer, arreter };
})();

/* Petit buzzer discret (autre lettre) : un seul à la fois, jamais par-dessus une voix */
const Buzz = (function(){
  let el = null;
  function arreter(){ if(el){ try{ el.pause(); }catch(_){} el.onended = el.onerror = null; el = null; } }
  function jouer(){
    if(!AUDIO.buzzer || Voix.occupe()) return;
    arreter(); Sfx.arreter();
    try{ const a = new Audio(AUDIO.buzzer); a.volume = 0.7; el = a; a.onended = a.onerror = ()=>{ if(el===a) el = null; };
      const p = a.play(); if(p && p.catch) p.catch(()=>{ if(el===a) el = null; }); }catch(_){ el = null; }
  }
  return { jouer, arreter };
})();
/* Moodle : hauteur + fin d'activité */
const Activite = { commencee:false, termine:false, niveauxFaits:[] };
window.PAZAPA_ACTIVITE = Activite;
function envoyerHauteur(){ if(window.parent===window) return; try{ window.parent.postMessage({type:'pazapa-hauteur',hauteur:document.documentElement.scrollHeight,etape:'Les oiseaux — son F'},'*'); }catch(_){} }
if(window.ResizeObserver) new ResizeObserver(envoyerHauteur).observe(document.body);
window.addEventListener('load',envoyerHauteur);
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ Voix.arreter(); Sfx.arreter(); } });
window.addEventListener('pagehide',()=>{ Voix.arreter(); Sfx.arreter(); });

/* ===================== OISEAU (SVG sans emoji : même rendu partout) ===================== */
function svgOiseau(lettre,pal){
  const s = sv('svg',{viewBox:'0 0 100 100','aria-hidden':'true',focusable:'false'});
  const pulse = sv('g',{class:'pulse'}); s.append(pulse);
  const art = sv('g',{class:'art'}); pulse.append(art);
  art.append(sv('path',{d:'M14 40 L2 30 L6 50 L2 66 L18 58 Z',fill:pal[1]}));                  // queue
  art.append(sv('ellipse',{cx:'50',cy:'54',rx:'36',ry:'33',fill:pal[0],stroke:pal[1],'stroke-width':'3'}));   // corps
  art.append(sv('path',{d:'M30 38 Q40 14 62 24 Q52 30 54 42 Z',fill:pal[1],opacity:'.55'}));    // aile
  art.append(sv('path',{d:'M84 46 L98 52 L84 60 Z',fill:'#FCC104',stroke:'#D9A400','stroke-width':'2','stroke-linejoin':'round'}));   // bec
  art.append(sv('circle',{cx:'72',cy:'40',r:'5',fill:'#2E2E2D'})); art.append(sv('circle',{cx:'73.6',cy:'38.4',r:'1.7',fill:'#fff'}));   // œil
  pulse.append(sv('circle',{class:'badge',cx:'46',cy:'62',r:'25',fill:'#fff',stroke:'#2E2E2D','stroke-width':'2.5'}));
  const t = sv('text',{class:'lettre',x:'46',y:'62','text-anchor':'middle','dominant-baseline':'central','font-size':'38','font-weight':'bold',fill:'#2E2E2D','font-family':'Arial,Helvetica,sans-serif'}); t.textContent = lettre; pulse.append(t);
  return { s, art, t };
}

/* ===================== NIVEAU ===================== */
function niveau(n){                                                 // affiche le niveau EN PRÉPARATION : le défi ne démarre qu'au clic sur « C'est parti ! » (lancer)
  nettoyer(); document.body.classList.remove('fin-jeu');
  const cfg = NIVEAUX[n];
  const E = { phase:'prep', trouvees:0, aideN:0, temps:cfg.duree, fin:0, tempsFini:false };   // phases : prep (consigne, oiseaux immobiles) → jeu (chrono + vol) → fini | temps
  /* lettres : exactement nbR fois « F », autres lettres réparties de façon équilibrée */
  const lettres = Array(cfg.nbR).fill('F'); for(let i=0;i<cfg.oiseaux-cfg.nbR;i++) lettres.push(cfg.autres[i % cfg.autres.length]);
  const ordre = melanger(lettres);

  const compteur = h('span',{class:'pilule'});
  const chrono = h('span',{class:'pilule jaune'});
  const msgT = h('p',{text:T.prepa(cfg.duree)}), modele = h('span',{class:'modele cache','aria-hidden':'true',text:'F'});
  const btnA = h('button',{type:'button',class:'btn second petit',onclick:aide},'💡 J’ai besoin d’aide');
  const btnR = h('button',{type:'button',class:'btn second petit',onclick:()=>niveau(n)},'↻ Recommencer');
  const btnGo = h('button',{type:'button',class:'btn',onclick:lancer},'▶ C’est parti !');
  const btnE = h('button',{type:'button',class:'btn cache',onclick:()=>niveau(n)},'↻ Réessayer');
  const btnN = h('button',{type:'button',class:'btn cache',onclick:()=>{ if(n<2) niveau(n+1); else fin(); }},n<2?'Niveau suivant ▶':'Continuer ▶');
  const ciel = h('div',{class:'ciel'+(n===2?' n3':''),role:'group','aria-label':'Ciel avec des oiseaux qui portent des lettres'});
  ciel.append(modele);   // modèle de l'aide 2 : posé dans le coin du ciel (le bandeau du bas a été retiré)
  [[8,10,90],[62,22,70],[30,68,80]].forEach(([l,t,w])=> ciel.append(h('span',{class:'nuage',style:`left:${l}%;top:${t}%;width:${w}px`})));
  const btnEc = btnSon(AUDIO.consigne,'Écouter la consigne');
  scene.replaceChildren(h('section',{},
    h('div',{class:'carte'}, h('p',{class:'sur-titre',text:'Niveau '+(n+1)+' · '+cfg.nom})),
    h('div',{class:'infos'}, h('button',{type:'button',class:'btn second petit',onclick:accueil},'🏠 Accueil'), compteur, chrono),
    h('div',{class:'consigne'}, img(IMG.abeille,'Pazita'), h('p',{text:T.consigne}), btnEc),
    ciel,
    h('div',{class:'bas'}, h('div',{class:'actions',style:'margin:0'}, btnA, btnGo, btnN, btnE, btnR))));   /* aide et recommencer de part et d'autre du bouton principal */   /* message écrit du bas retiré (demande de la professeure) */
  tm(()=>{ if(E.phase==='prep' && !Voix.occupe()) Voix.jouer(AUDIO.consigne); },400);   // consigne lancée automatiquement à l'ouverture de chaque niveau (réécoutable avec « Écouter »)
  const maj = ()=>{ compteur.textContent = 'Lettres F trouvées : '+E.trouvees+' / '+cfg.nbR;
    chrono.textContent = E.tempsFini ? 'Temps écoulé' : 'Temps : '+Math.ceil(E.temps)+' s'; };
  maj();

  /* création des oiseaux : grille régulière (aucun recouvrement au départ) */
  const oiseaux = [];
  const W = ()=>ciel.clientWidth, H = ()=>ciel.clientHeight;
  function creer(){
    const w = W(), hh = H(), nb = cfg.oiseaux, cols = Math.ceil(Math.sqrt(nb*w/hh)), rows = Math.ceil(nb/cols), cw = w/cols, ch = hh/rows;
    ordre.forEach((l,i)=>{
      const pal = PAL[Math.floor(Math.random()*PAL.length)]; const o = svgOiseau(l,pal);
      const el = h('button',{type:'button',class:'oiseau','aria-label':'Oiseau portant la lettre '+l}); el.append(o.s); ciel.append(el);
      const sz = el.offsetWidth||80, c = i%cols, r = Math.floor(i/cols);
      const b = { el, art:o.art, txt:o.t, lettre:l, sz, x:Math.max(0,Math.min(w-sz,c*cw+(cw-sz)/2+rnd(-4,4))), y:Math.max(0,Math.min(hh-sz,r*ch+(ch-sz)/2+rnd(-4,4))), vx:0, vy:0, done:false, bloque:false, sens:1 };
      const a = rnd(0,Math.PI*2); b.vx = Math.cos(a)*VITESSE; b.vy = Math.sin(a)*VITESSE*.7;
      el.style.transform = 'translate('+b.x+'px,'+b.y+'px)';
      el.disabled = true; el.addEventListener('click',()=>toucher(b));
      oiseaux.push(b);
    });
  }
  creer();

  /* mouvement : lent, fluide, constant ; les oiseaux se repoussent doucement (jamais de recouvrement durable) ; rien ne bouge en mode « réduire les mouvements » */
  let raf = 0, dernier = performance.now(), pause = false;
  function setSens(b){ const s = b.vx<0 ? -1 : 1; if(s!==b.sens){ b.sens = s; b.art.setAttribute('transform', s<0 ? 'translate(100 0) scale(-1 1)' : ''); } }
  function separer(){
    for(let i=0;i<oiseaux.length;i++){ const a = oiseaux[i]; for(let j=i+1;j<oiseaux.length;j++){ const b = oiseaux[j];
      const dx = (b.x+b.sz/2)-(a.x+a.sz/2), dy = (b.y+b.sz/2)-(a.y+a.sz/2), min = (a.sz+b.sz)/2*0.92, d2 = dx*dx+dy*dy;
      if(d2<min*min){ const d = Math.sqrt(d2)||0.01, nx = dx/d, ny = dy/d, rec = (min-d)/2;
        if(!a.done&&!a.bloque){ a.x -= nx*rec; a.y -= ny*rec; } if(!b.done&&!b.bloque){ b.x += nx*rec; b.y += ny*rec; }
        const va = a.vx*nx+a.vy*ny, vb = b.vx*nx+b.vy*ny;                         // rebond élastique le long de la normale
        if(va-vb>0){ const dv = va-vb; a.vx -= dv*nx; a.vy -= dv*ny; b.vx += dv*nx; b.vy += dv*ny; } } } }
  }
  function image(now){
    const reel = Math.max(0,now-dernier), dt = Math.min(reel/16.667,3); dernier = now;
    if(!E.tempsFini && E.phase==='jeu'){
      E.temps = Math.max(0,(E.fin-performance.now())/1000);   // heure de fin réelle (performance.now) : un navigateur ralenti ne prolonge jamais le défi
      if(E.temps<=0) tempsEcoule();                            // aucune pénalité, aucun son
      maj(); }
    if(E.phase==='jeu' && !Opt.reduit && !pause){
      const w = W(), hh = H();
      oiseaux.forEach(b=>{ if(b.done||b.bloque) return;
        b.x += b.vx*dt; b.y += b.vy*dt;
        if(b.x<0){ b.x = 0; b.vx = Math.abs(b.vx); } else if(b.x>w-b.sz){ b.x = w-b.sz; b.vx = -Math.abs(b.vx); }
        if(b.y<0){ b.y = 0; b.vy = Math.abs(b.vy); } else if(b.y>hh-b.sz){ b.y = hh-b.sz; b.vy = -Math.abs(b.vy); }
        const v = Math.hypot(b.vx,b.vy)||1; b.vx *= VITESSE/v; b.vy *= VITESSE/v; });                // vitesse toujours égale : ni accélération ni ralentissement
      separer();
      oiseaux.forEach(b=>{ const w2 = w-b.sz, h2 = hh-b.sz; b.x = Math.min(Math.max(b.x,0),Math.max(0,w2)); b.y = Math.min(Math.max(b.y,0),Math.max(0,h2)); setSens(b); b.el.style.transform = 'translate('+b.x.toFixed(1)+'px,'+b.y.toFixed(1)+'px)'; });
    }
    raf = requestAnimationFrame(image);
  }
  raf = requestAnimationFrame(image);
  /* mouvement suspendu pendant qu'un oiseau a le focus clavier (utilisable au clavier) */
  ciel.addEventListener('focusin',e=>{ let kb = false; try{ kb = e.target.matches(':focus-visible'); }catch(_){} pause = kb; });   // pause seulement au clavier : un clic ou un toucher ne fige jamais les oiseaux
  ciel.addEventListener('focusout',()=>{ pause = false; });
  const redim = ()=>{ const w = W(), hh = H(); oiseaux.forEach(b=>{ b.sz = b.el.offsetWidth||b.sz; b.x = Math.min(Math.max(b.x,0),Math.max(0,w-b.sz)); b.y = Math.min(Math.max(b.y,0),Math.max(0,hh-b.sz)); b.el.style.transform = 'translate('+b.x+'px,'+b.y+'px)'; }); };
  window.addEventListener('resize',redim); let ro = null;
  if(window.ResizeObserver){ ro = new ResizeObserver(redim); ro.observe(ciel); }
  nettoyageNiveau = ()=>{ cancelAnimationFrame(raf); window.removeEventListener('resize',redim); if(ro) ro.disconnect(); };

  function etoilesAutour(b){ if(Opt.reduit) return; for(let k=0;k<4;k++){ const s = h('span',{class:'pluie','aria-hidden':'true',text:'★',style:'left:'+(b.x+rnd(8,b.sz-14))+'px;top:'+(b.y+rnd(0,b.sz/2))+'px;animation-delay:'+(k*0.08)+'s'}); ciel.append(s); setTimeout(()=>s.remove(),1300); } }
  const base = ()=> E.phase==='prep' ? T.prepa(cfg.duree) : T.cherche;
  function masquerModele(){ if(!modele.classList.contains('cache')){ modele.classList.add('cache'); if(msgT.textContent===T.aide2) msgT.textContent = base(); } }
  function sansIndice(){ oiseaux.forEach(o=>o.el.classList.remove('brille')); if(msgT.textContent===T.aide3) msgT.textContent = base(); }
  function toucher(b){
    if(E.phase!=='jeu' || b.done || b.bloque) return;                 // clic ignoré : oiseau déjà trouvé ou en cours d'animation
    Voix.arreter(); masquerModele(); sansIndice();                    // un clic valide interrompt toute consigne encore en lecture
    if(b.lettre==='F'){
      b.done = true; b.el.disabled = true; b.el.classList.add('ok'); b.el.setAttribute('aria-label','Oiseau portant la lettre F, trouvé');
      E.trouvees++; maj(); etoilesAutour(b); Sfx.jouer();
      const reste = cfg.nbR-E.trouvees;
      if(reste===0) return niveauFini();
      msgT.textContent = reste===1 ? T.reste1 : T.ok[E.trouvees % T.ok.length];
    }else{                                                           // autre lettre : étoile un instant, aucun message culpabilisant, aucune pénalité
      b.bloque = true; b.el.classList.add('etoile'); b.txt.textContent = '★'; msgT.textContent = T.autre; Buzz.jouer();   // petit buzzer discret
      tm(()=>{ b.bloque = false; },REPRISE_VOL_MS);                                         // l'oiseau touché repart une demi-seconde après la sélection
      tm(()=>{ b.txt.textContent = b.lettre; b.el.classList.remove('etoile'); },DUREE_MAUVAIS_MS);
    }
  }
  function aide(){                                                   // à la demande uniquement, 3 crans, sans pénalité, redemandable
    if(E.phase!=='jeu' && E.phase!=='prep') return;                  // aides accessibles dès la préparation et pendant tout le défi ; elles n'arrêtent jamais le chronomètre
    if(E.aideN<3) E.aideN++;
    sansIndice(); masquerModele();
    if(E.aideN===1){ msgT.textContent = T.aide1; Voix.jouer(AUDIO.aide1); }
    else if(E.aideN===2){ msgT.textContent = T.aide2; modele.classList.remove('cache'); Voix.jouer(AUDIO.aide2); }
    else{
      const cible = oiseaux.find(o=>o.lettre==='F' && !o.done);
      if(cible){ msgT.textContent = T.aide3; cible.el.classList.add('brille'); Voix.jouer(AUDIO.aide3);
        tm(()=>{ cible.el.classList.remove('brille'); if(msgT.textContent===T.aide3) msgT.textContent = base(); },DUREE_INDICE_MS); }
    }
  }
  function lancer(){                                                  // début du défi : chrono ET vol démarrent ensemble
    if(E.phase!=='prep') return;
    Voix.arreter(); E.phase = 'jeu'; E.temps = cfg.duree; dernier = performance.now(); E.fin = dernier + cfg.duree*1000;   // chrono et vol démarrent ensemble
    oiseaux.forEach(b=>{ if(!b.done) b.el.disabled = false; });
    btnGo.classList.add('cache'); msgT.textContent = T.cherche; maj();
  }
  function figer(){ oiseaux.forEach(b=>{ b.el.disabled = true; }); }   // oiseaux immobiles (la boucle ne les déplace plus) et réponses désactivées
  function tempsEcoule(){
    E.temps = 0;
    E.tempsFini = true; E.phase = 'temps'; figer(); btnA.disabled = true; Voix.arreter();
    msgT.textContent = T.tempsOk; modele.classList.add('cache'); sansIndice(); btnE.classList.remove('cache'); try{ btnE.focus({preventScroll:true}); }catch(_){}
  }
  function niveauFini(){
    E.phase='fini'; btnA.disabled = true; figer(); sansIndice();
    if(!Activite.niveauxFaits.includes(n)) Activite.niveauxFaits.push(n);
    msgT.textContent = T.niveauOk; btnN.classList.remove('cache'); try{ btnN.focus({preventScroll:true}); }catch(_){}
    tm(()=>Voix.jouer(AUDIO.reussite),900);                          // la voix de réussite suit le petit son, sans le recouvrir
  }
}

/* ===================== FIN ===================== */
function fin(){
  nettoyer(); document.body.classList.add('fin-jeu');
  const ciel = h('div',{class:'ciel-fin'},
    h('div',{class:'persos'}, img(IMG.leo,'Léo'), img(IMG.fadi,'Fadi')),
    h('div',{class:'ligne-bravo'}, img(IMG.abeille,'Pazita'), h('div',{}, h('h1',{text:T.fin}), h('p',{class:'fin-sous',text:T.fin2}))));
  if(!Opt.reduit) for(let k=0;k<14;k++) ciel.append(h('span',{class:'etoile-fin','aria-hidden':'true',text:'★',style:'left:'+rnd(4,96).toFixed(0)+'%;animation-delay:'+rnd(0,1.6).toFixed(2)+'s;font-size:'+rnd(14,26).toFixed(0)+'px'}));
  scene.replaceChildren(h('section',{class:'ecran-fin'}, ciel,
    h('div',{class:'actions'}, btnSon(AUDIO.fin,'Écouter le message de fin'),
      h('button',{type:'button',class:'btn',onclick:()=>{ Activite.niveauxFaits = []; Activite.termine = false; accueil(); }},'↻ Rejouer'))));
  terminee();                                                       // fin d'activité signalée à Moodle dès l'écran final
  tm(()=>{ if(!Voix.occupe()) Voix.jouer(AUDIO.fin); },600);       // message de fin lancé automatiquement (réécoutable avec « Écouter »)
}
function terminee(){
  if(Activite.termine) return; Activite.termine = true;
  try{ if(window.parent!==window) window.parent.postMessage({type:'pazapa-activite-terminee',jeu:'oiseaux',lettre:'F'},'*'); }catch(_){}
}
accueil();
})();
</script>
